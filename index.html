}

/* =======================================================================
   STEP 3 — FALLING WATER DROPS
   ======================================================================= */
function step3(app){
  const targets = shuffle(vocab); let ti = 0, target = null, misses = 0, running = true, spawnT = .2;
  const f = frame(app, 3, 'Look and listen, then click the water drop with the matching word before it reaches the bottom.');
  f.root.querySelector('.step-head').remove();
  const layer = el('<div class="rain-layer"></div>');
  const card = el('<div class="rain-card"><div class="rt-pic"></div><button class="speaker" aria-label="Hear it again">🔊</button></div>');
  app.append(layer, card);
  $('.speaker', card).addEventListener('click', () => { Sound.ensure(); sayItem(target); });
  let drops = [], parts = [];

  function nextTarget(){
    if (ti >= targets.length){
      running = false;
      const st = misses === 0 ? 3 : misses <= 3 ? 2 : 1;
      return later(() => finishStep(3, st, `You caught all ${targets.length} words!`), 900);
    }
    target = targets[ti]; $('.rt-pic', card).innerHTML = pic(target);
    later(() => sayItem(target), 250);
    if (!drops.some(d => !d.dead && d.item === target)) spawnT = Math.min(spawnT, .3);
  }

  function spawn(){
    const W = layer.clientWidth, H = layer.clientHeight, live = drops.filter(d => !d.dead);
    const hasT = live.some(d => d.item === target);
    const pool = vocab.filter(v => v !== target && !live.some(d => d.item === v));
    const item = !hasT || !pool.length || Math.random() < .2 ? target : pick(pool);
    const node = el(`<button class="drop" aria-label="${esc(item.word)}"><svg viewBox="0 0 100 120" aria-hidden="true"><use href="#dropShape"/></svg><span>${esc(item.word)}</span></button>`);
    layer.appendChild(node);
    const w = node.offsetWidth, h = node.offsetHeight;
    let minX = card.getBoundingClientRect().right + 10; if (W - w - 8 - minX < w * 2) minX = 8;
    let x, tries = 0;
    do { x = rand(minX, W - w - 8); tries++; } while (tries < 30 && live.some(d => Math.abs(d.x - x) < w * 1.05 && d.y < h * 1.6));
    const d = { node, item, x, y: -h, w, h, speed: H / 13 * rand(.94, 1.06) + ti * 3, dead:false };
    node.style.transform = `translate3d(${x}px, ${d.y}px, 0)`;
    drops.push(d);
    node.addEventListener('pointerdown', e => { e.preventDefault(); Sound.ensure(); hit(d); });
  }

  function splash(cx, cy, n){
    ['', ' r2'].forEach(c => { const r = el(`<span class="splash-ring${c}"></span>`); r.style.left = cx + 'px'; r.style.top = cy + 'px'; layer.appendChild(r); setTimeout(() => r.remove(), 1000); });
    for (let i = 0; i < n; i++){
      const size = rand(6, 17), a = rand(-Math.PI * .97, -Math.PI * .03), sp = rand(170, 430);
      const node = el('<span class="wp"></span>');
      node.style.width = node.style.height = size + 'px'; node.style.marginLeft = node.style.marginTop = (-size / 2) + 'px';
      layer.appendChild(node);
      parts.push({ node, x:cx, y:cy, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp, t:0, life:rand(.6, 1.05) });
    }
  }

  function hit(d){
    if (d.dead || !running) return;
    if (d.item === target){
      d.dead = true; d.node.classList.add('gone');
      splash(d.x + d.w / 2, d.y + d.h * .62, 15 + randInt(11)); Sound.splash();
      setTimeout(() => d.node.remove(), 150);
      later(() => sayItem(d.item), 180);
      ti++; nextTarget();
    } else { misses++; Sound.wrong(); flash(d.node, 'err'); }
  }

  animLoop(dt => {
    if (!running && !parts.length) return false;
    const W = layer.clientWidth, H = layer.clientHeight;
    if (running){
      spawnT -= dt;
      const maxLive = Math.max(4, Math.min(7, Math.round(W / 230)));
      if (spawnT <= 0 && drops.filter(d => !d.dead).length < maxLive){ spawn(); spawnT = rand(1.5, 2.2); }
      if (!drops.some(d => !d.dead && d.item === target) && spawnT > .5) spawnT = .5;
    }
    for (const d of drops){
      if (d.dead) continue;
      d.y += d.speed * dt;
      d.node.style.transform = `translate3d(${d.x}px, ${d.y}px, 0)`;
      if (d.y + d.h * .9 > H){
        d.dead = true; d.node.classList.add('land'); splash(d.x + d.w / 2, H - 14, 6);
        if (d.item === target) Sound.drip();
        setTimeout(() => d.node.remove(), 400);
      }
    }
    drops = drops.filter(d => !d.dead || d.node.isConnected);
    for (const p of parts){
      p.t += dt; p.vy += 1000 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      const k = Math.max(0, 1 - p.t / p.life);
      p.node.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) scale(${.35 + .65 * k})`;
      p.node.style.opacity = k;
    }
    parts = parts.filter(p => { if (p.t < p.life) return true; p.node.remove(); return false; });
  });
  nextTarget();
}

/* =======================================================================
   STEP 4 — SLOW REVEAL (blur)
   ======================================================================= */
function step4(app){
  const LEVELS = [30, 22, 15, 10, 6, 3, 0];
  const rounds = shuffle(vocab).slice(0, Math.min(6, vocab.length));
  let r = 0, lvl = 0, score = 0, locked = false, target = null;
  const f = frame(app, 4, 'The picture is hiding in the fog! Tap it to make it clearer, then choose the right word. Fewer taps = more points!');
  f.body.innerHTML = `<div class="reveal">
      <div class="reveal-pic-wrap" role="button" aria-label="Tap to make the picture clearer"><div class="clip"></div><div class="clarity"><i></i></div></div>
      <div class="reveal-opts"></div></div>`;
  const wrap = $('.reveal-pic-wrap', f.body), clip = $('.clip', f.body), opts = $('.reveal-opts', f.body), bar = $('.clarity i', f.body);
  const apply = () => { const p = $('.pic', clip); p.style.filter = `blur(${LEVELS[lvl]}px) saturate(${.4 + lvl * .1})`; p.style.transform = `scale(${1 + LEVELS[lvl] / 100})`; bar.style.width = `${lvl / (LEVELS.length - 1) * 100}%`; };

  function round(){
    if (r >= rounds.length){
      const max = rounds.length * 5, ratio = score / max;
      return finishStep(4, ratio >= .7 ? 3 : ratio >= .45 ? 2 : 1, `You scored ${score} out of ${max} points.`);
    }
    target = rounds[r]; lvl = 0; locked = false;
    clip.innerHTML = pic(target); apply();
    opts.innerHTML = optionsFor(target, Math.min(4, vocab.length)).map(o => `<button class="opt" data-id="${o.id}">${esc(o.word)}</button>`).join('');
    $$('.opt', opts).forEach(b => b.addEventListener('click', () => choose(b)));
  }
  function choose(b){
    if (locked || b.disabled) return;
    if (+b.dataset.id === target.id){
      locked = true; const pts = Math.max(1, 5 - lvl); score += pts;
      lvl = LEVELS.length - 1; apply(); b.classList.add('good'); Sound.correct(); sayItem(target);
      r++; later(round, 1800);
    } else {
      b.classList.add('bad'); b.disabled = true; Sound.wrong();
      if (lvl < LEVELS.length - 1){ lvl++; apply(); }
    }
  }
  wrap.addEventListener('click', () => { if (locked || lvl >= LEVELS.length - 1) return; lvl++; apply(); Sound.reveal(); });
  round();
}

/* =======================================================================
   STEP 5 — WORD SEARCH
   ======================================================================= */
function step5(app){
  const MAX_N = 12, norm = w => w.toUpperCase().replace(/[\s\-'.]/g, '');
  const fits = vocab.filter(v => { const n = norm(v.word); return n.length >= 2 && n.length <= MAX_N; });
  const f = frame(app, 5, 'Find the hidden words! Drag across the letters — or tap the first letter and then the last letter.');
  if (!fits.length){
    f.body.innerHTML = `<div class="panel center-msg"><div class="big-emoji">📏</div><button class="btn" id="skip5">▶</button></div>`;
    $('#skip5').addEventListener('click', () => go(6)); return;
  }
  const longest = Math.max(...fits.map(v => norm(v.word).length));
  let N = Math.min(MAX_N, Math.max(7, longest + 1));
  const DIRS = [[0,1],[1,0],[1,1],[-1,1]];
  function tryBuild(list, n){
    for (let attempt = 0; attempt < 450; attempt++){
      const grid = Array.from({length:n}, () => Array(n).fill('')), placed = []; let ok = true;
      for (const it of [...list].sort((a, b) => norm(b.word).length - norm(a.word).length)){
        const w = norm(it.word); let done = false;
        for (let t = 0; t < 160 && !done; t++){
          const [dr, dc] = pick(DIRS), r0 = randInt(n), c0 = randInt(n), r1 = r0 + dr * (w.length - 1), c1 = c0 + dc * (w.length - 1);
          if (r1 < 0 || r1 >= n || c1 < 0 || c1 >= n) continue;
          let fitsHere = true;
          for (let k = 0; k < w.length; k++){ const ch = grid[r0 + dr*k][c0 + dc*k]; if (ch && ch !== w[k]){ fitsHere = false; break; } }
          if (!fitsHere) continue;
          const cells = [];
          for (let k = 0; k < w.length; k++){ grid[r0 + dr*k][c0 + dc*k] = w[k]; cells.push((r0 + dr*k) * n + c0 + dc*k); }
          placed.push({ item:it, w, cells, found:false }); done = true;
        }
        if (!done){ ok = false; break; }
      }
      if (ok) return { grid, placed };
    }
    return null;
  }
  let chosen = shuffle(fits), built = null;
  while (!built && chosen.length){
    for (let n = N; n <= MAX_N && !built; n++){ built = tryBuild(chosen, n); if (built) N = n; }
    if (!built) chosen = chosen.slice(0, -1);
  }
  const { grid, placed } = built;
  const allLatin = placed.every(p => /^[A-Z]+$/.test(p.w));
  const filler = allLatin ? 'ABCDEFGHIJKLMNOPRSTUVWY' : placed.map(p => p.w).join('');
  const letters = grid.flat().map(ch => ch || pick(filler));

  f.body.innerHTML = `<div class="ws">
      <div class="ws-board"><div class="ws-grid" style="--n:${N}">${letters.map((ch, i) => `<div class="ws-cell" data-i="${i}">${esc(ch)}</div>`).join('')}</div></div>
      <div class="ws-side panel">
        ${placed.map((p, k) => `<div class="ws-item" data-k="${k}">${pic(p.item)}<b>${esc(p.item.word)}</b></div>`).join('')}
      </div></div>`;
  bindCaseToggle(f.tools.appendChild(el(caseToggleHTML())), lower => $('.ws', f.body).classList.toggle('lower', lower));
  const gridEl = $('.ws-grid', f.body), cells = $$('.ws-cell', f.body);
  let start = null, path = [], anchor = null, wrongs = 0, foundCount = 0;
  $$('.ws-item', f.body).forEach(it => it.addEventListener('click', () => sayItem(placed[+it.dataset.k].item)));

  const cellAt = (x, y) => { const e = document.elementFromPoint(x, y); return e && e.closest ? e.closest('.ws-cell') : null; };
  function line(a, b){
    const ar = Math.floor(a / N), ac = a % N, br = Math.floor(b / N), bc = b % N;
    if (!(ar === br || ac === bc || Math.abs(br - ar) === Math.abs(bc - ac))) return null;
    const dr = Math.sign(br - ar), dc = Math.sign(bc - ac), len = Math.max(Math.abs(br - ar), Math.abs(bc - ac));
    return Array.from({length:len + 1}, (_, k) => (ar + dr*k) * N + ac + dc*k);
  }
  const paint = p => cells.forEach((c, i) => c.classList.toggle('sel', p.includes(i)));
  const clearAnchor = () => { if (anchor != null) cells[anchor].classList.remove('anchor'); anchor = null; };
  function drawPill(p, col){
    const a = cells[p[0]], z = cells[p[p.length - 1]];
    const ax = a.offsetLeft + a.offsetWidth / 2, ay = a.offsetTop + a.offsetHeight / 2, zx = z.offsetLeft + z.offsetWidth / 2, zy = z.offsetTop + z.offsetHeight / 2;
    const len = Math.hypot(zx - ax, zy - ay) + a.offsetWidth * .92, h = a.offsetHeight * .82;
    gridEl.appendChild(el(`<div class="ws-pill" style="--pc:${col};width:${len}px;height:${h}px;left:${(ax + zx) / 2 - len / 2}px;top:${(ay + zy) / 2 - h / 2}px;rotate:${Math.atan2(zy - ay, zx - ax)}rad"></div>`));
  }
  function check(p){
    paint([]);
    const s = p.map(i => letters[i]).join(''), rev = [...s].reverse().join('');
    const hit = placed.find(w => !w.found && (w.w === s || w.w === rev));
    if (hit){
      hit.found = true; hit.path = p; foundCount++;
      p.forEach((i, k) => { const c = cells[i]; c.style.animationDelay = `${k * 50}ms`; flash(c, 'found'); });
      drawPill(p, COLORS[hit.item.id % COLORS.length]);
      $(`.ws-item[data-k="${placed.indexOf(hit)}"]`, f.body).classList.add('found');
      Sound.correct(); sayItem(hit.item);
      if (foundCount === placed.length) later(() => finishStep(5, wrongs <= 1 ? 3 : wrongs <= 4 ? 2 : 1, `You found all ${placed.length} hidden words!`), 900);
    } else if (p.length > 1){
      wrongs++; Sound.wrong(); p.forEach(i => flash(cells[i], 'err'));
    }
  }
  onGlobal(window, 'resize', () => { $$('.ws-pill', gridEl).forEach(x => x.remove()); placed.filter(w => w.found).forEach(w => drawPill(w.path, COLORS[w.item.id % COLORS.length])); });
  gridEl.addEventListener('pointerdown', e => {
    const c = cellAt(e.clientX, e.clientY); if (!c) return;
    e.preventDefault(); Sound.ensure(); try { gridEl.setPointerCapture(e.pointerId); } catch(_){}
    start = +c.dataset.i; path = [start]; paint(path); Sound.click();
  });
  gridEl.addEventListener('pointermove', e => {
    if (start == null) return; const c = cellAt(e.clientX, e.clientY); if (!c) return;
    const p = line(start, +c.dataset.i); if (p){ path = p; paint(p); }
  });
  const endSel = () => {
    if (start == null) return; const s = start; start = null;
    if (path.length === 1){
      if (anchor != null && anchor !== s){ const p = line(anchor, s); clearAnchor(); if (p) check(p); else { paint([]); Sound.wrong(); } }
      else if (anchor === s){ clearAnchor(); paint([]); }
      else { anchor = s; cells[s].classList.add('anchor'); paint([]); }
    } else { clearAnchor(); check(path); }
  };
  gridEl.addEventListener('pointerup', endSel);
  gridEl.addEventListener('pointercancel', () => { start = null; paint([]); });
}

/* =======================================================================
   STEP 6 — MEMORY MATCH (scales cleanly up to 10 pairs = 20 cards)
   ======================================================================= */
function step6(app){
  const items = vocab.slice(0, MAX_WORDS);
  const cards = shuffle(items.flatMap(v => [{ v, t:'pic' }, { v, t:'word' }]));
  const ASPECT = 1.5;
  let open = [], lock = false, moves = 0, pairs = 0;
  const f = frame(app, 6, 'Flip two cards at a time. Match each picture with its word!');
  f.body.innerHTML = `<div class="mm"><div class="mm-grid">${cards.map((c, i) => `
      <button class="mm-card" data-i="${i}" aria-label="Card ${i + 1}"><div class="mm-inner">
        <div class="mm-back"><span class="mm-num">${i + 1}</span></div>
        <div class="mm-front">${c.t === 'pic' ? pic(c.v) : `<span class="mm-word" style="--fit:${Math.min(1, 7 / Math.max(1, c.v.word.length))}">${esc(c.v.word)}</span>`}</div>
      </div></button>`).join('')}</div></div>`;
  const wrap = $('.mm', f.body), gridEl = $('.mm-grid', f.body), nodes = $$('.mm-card', f.body);

  function layout(){
    const W = wrap.clientWidth, H = wrap.clientHeight, gap = Math.max(6, Math.min(18, W * .012)), n = cards.length;
    let best = { w:0, cols:4 };
    for (let cols = 2; cols <= Math.min(10, n); cols++){
      const rows = Math.ceil(n / cols);
      const w = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) * ASPECT);
      if (w > best.w) best = { w, cols };
    }
    gridEl.style.gap = gap + 'px';
    gridEl.style.gridTemplateColumns = `repeat(${best.cols}, ${Math.floor(best.w)}px)`;
  }
  layout(); onGlobal(window, 'resize', layout);

  nodes.forEach((n, i) => n.addEventListener('click', () => {
    const c = cards[i];
    if (lock || c.open || c.matched) return;
    c.open = true; n.classList.add('open'); turnCard(n, true); Sound.flip(); open.push(i);
    if (open.length < 2) return;
    moves++; lock = true;
    const [a, b] = open.map(k => cards[k]);
    if (a.v === b.v && a.t !== b.t){
      later(() => {
        open.forEach(k => { cards[k].matched = true; nodes[k].classList.add('matched'); });
        open = []; lock = false; pairs++; Sound.correct(); sayItem(a.v);
        if (pairs === items.length){
          const st = moves <= items.length + 3 ? 3 : moves <= items.length * 2 ? 2 : 1;
          later(() => finishStep(6, st, `All pairs matched in ${moves} moves!`), 900);
        }
      }, 650);
    } else {
      later(() => { open.forEach(k => { cards[k].open = false; nodes[k].classList.remove('open'); turnCard(nodes[k], false); }); open = []; lock = false; Sound.flip(); }, 1200);
    }
  }));
}

/* =======================================================================
   STEP 7 — WORD CHAIN
   ======================================================================= */
function step7(app){
  const words = shuffle(vocab).map(v => ({ v, w: v.word.toLowerCase().replace(/\s+/g, ''), found:false }));
  let pos = 0; words.forEach(x => { x.start = pos; pos += x.w.length; x.end = pos; });
  const letters = words.map(x => x.w).join('');
  let mistakes = 0, foundCount = 0, start = null, range = null, anchor = null;
  const f = frame(app, 7, 'The words are stuck together! Drag across the letters of a word to highlight it. Tap a picture to hear a hint.');
  f.body.innerHTML = `<div class="chain-wrap">
      <div class="chain-hints">${shuffle(words).map(x => `<button class="ch-hint" data-id="${x.v.id}">${pic(x.v)}</button>`).join('')}</div>
      <div class="chain panel">${[...letters].map((ch, i) => `<span class="ch-l" data-i="${i}">${esc(ch)}</span>`).join('')}</div>
    </div>`;
  const chain = $('.chain', f.body), ls = $$('.ch-l', f.body);
  bindCaseToggle(f.tools.appendChild(el(caseToggleHTML())), lower => $('.chain-wrap', f.body).classList.toggle('lower', lower));
  $$('.ch-hint', f.body).forEach(b => b.addEventListener('click', () => sayItem(vocab[+b.dataset.id])));

  const letterAt = (x, y) => { const e = document.elementFromPoint(x, y); return e && e.closest ? e.closest('.ch-l') : null; };
  function paint(a, b){
    const lo = Math.min(a, b), hi = Math.max(a, b);
    ls.forEach((l, i) => { const on = a != null && i >= lo && i <= hi; l.classList.toggle('sel', on); l.classList.toggle('sf', on && i === lo); l.classList.toggle('sl', on && i === hi); });
  }
  const clearAnchor = () => { if (anchor != null) ls[anchor].classList.remove('anchor'); anchor = null; };
  function check(a, b){
    paint(null);
    const lo = Math.min(a, b), hi = Math.max(a, b) + 1;
    const x = words.find(w => !w.found && w.start === lo && w.end === hi);
    if (x){
      x.found = true; foundCount++;
      const col = COLORS[x.v.id % COLORS.length];
      for (let i = lo; i < hi; i++){
        const l = ls[i]; l.style.setProperty('--wc', col); l.style.animationDelay = `${(i - lo) * 45}ms`;
        l.classList.toggle('wf', i === lo); l.classList.toggle('wl', i === hi - 1); flash(l, 'found');
      }
      const h = $(`.ch-hint[data-id="${x.v.id}"]`, f.body); h.classList.add('found');
      Sound.correct(); later(() => sayItem(x.v), 200);
      if (foundCount === words.length)
        later(() => finishStep(7, mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1, `You found all ${words.length} words in the chain!`), 1300);
    } else if (hi - lo > 1){
      mistakes++; Sound.wrong(); for (let i = lo; i < hi; i++) flash(ls[i], 'err');
    }
  }
  chain.addEventListener('pointerdown', e => {
    const l = letterAt(e.clientX, e.clientY); if (!l) return;
    e.preventDefault(); Sound.ensure(); try { chain.setPointerCapture(e.pointerId); } catch(_){}
    start = +l.dataset.i; range = [start, start]; paint(start, start); Sound.click();
  });
  chain.addEventListener('pointermove', e => {
    if (start == null) return; const l = letterAt(e.clientX, e.clientY); if (!l) return;
    const i = +l.dataset.i; if (i !== range[1]){ range = [start, i]; paint(start, i); }
  });
  chain.addEventListener('pointerup', () => {
    if (start == null) return; const [a, b] = range; start = null;
    if (a === b){
      if (anchor != null && anchor !== a){ const s = anchor; clearAnchor(); check(s, a); }
      else if (anchor === a){ clearAnchor(); paint(null); }
      else { anchor = a; ls[a].classList.add('anchor'); paint(null); }
    } else { clearAnchor(); check(a, b); }
  });
  chain.addEventListener('pointercancel', () => { start = null; paint(null); });
}

/* =======================================================================
   STEP 8 — DROP THE CURTAIN (scales cleanly up to 10 items)
   ======================================================================= */
function step8(app){
  const ROUNDS = Math.min(5, vocab.length); let r = 0, phase = 'look', missing = null, mistakes = 0, order = [];
  const f = frame(app, 8, 'Look carefully and remember every picture. When the curtain drops, one disappears… which word is missing?');
  let lookId = 0;
  const cols = vocab.length <= 4 ? 2 : vocab.length <= 6 ? 3 : 5, PANELS = 14;
  const panels = Array.from({length:PANELS}, (_, k) =>
    `<div class="cpanel" style="--sk:${(Math.sin(k * 1.7 + .4) * 1.5).toFixed(2)};--d:${Math.round(Math.abs(k - (PANELS - 1) / 2) * 45)}ms"></div>`).join('');
  f.body.innerHTML = `<div class="theater"><div class="stage"><div class="valance"></div><div class="stage-items" style="grid-template-columns:repeat(${cols},1fr)"></div><div class="cur-opts"></div><div class="curtain">${panels}</div></div></div>`;
  $('.stage', f.body).addEventListener('click', drop);
  const itemsEl = $('.stage-items', f.body), curtain = $('.curtain', f.body), opts = $('.cur-opts', f.body);
  const card = (v, k, showLabel=true) => `<div class="st-item" style="animation-delay:${k * 50}ms">${pic(v)}${showLabel ? `<b>${esc(v.word)}</b>` : '<b>&nbsp;</b>'}</div>`;

  function look(){
    if (r >= ROUNDS) return finishStep(8, mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1, `You spotted ${ROUNDS} missing words!`);
    phase = 'look'; order = shuffle(vocab);
    itemsEl.innerHTML = order.map((v, k) => card(v, k)).join('');
    opts.innerHTML = '';
    const id = ++lookId; later(() => { if (id === lookId) drop(); }, 3500 + vocab.length * 400);
  }
  function drop(){
    if (phase !== 'look') return; phase = 'drop';
    Sound.whoosh(); curtain.classList.remove('up'); curtain.classList.add('down');
    later(() => {
      missing = pick(order);
      itemsEl.innerHTML = order.map((v, k) => v === missing ? `<div class="st-item blank" data-missing="1"><div class="ph">?</div><b>&nbsp;</b></div>` : card(v, k, false)).join('');
    }, 1500);
    later(() => {
      Sound.whoosh(); curtain.classList.remove('down'); curtain.classList.add('up'); phase = 'guess';
      opts.innerHTML = shuffle(vocab).map(v => `<button class="opt" data-id="${v.id}">${esc(v.word)}</button>`).join('');
      $$('.opt', opts).forEach(b => b.addEventListener('click', () => guess(b)));
    }, 2600);
  }
  function guess(b){
    if (phase !== 'guess' || b.disabled) return;
    if (+b.dataset.id === missing.id){
      phase = 'done'; b.classList.add('good'); Sound.correct(); sayItem(missing);
      $$('.opt', opts).forEach(o => o.disabled = true);
      const back = el(card(missing, 0)); back.classList.add('back'); $('[data-missing]', itemsEl).replaceWith(back);
      r++; later(look, 2000);
    } else { mistakes++; b.classList.add('bad'); b.disabled = true; Sound.wrong(); }
  }
  look();
}

/* =======================================================================
   STEP 9 — BALLOON POP SPELLING
   ======================================================================= */
function step9(app){
  const rounds = shuffle(vocab).slice(0, Math.min(5, vocab.length));
  let r = 0, target = null, chars = [], idx = 0, balloons = [], mistakes = 0, active = false, clock = 0;
  const f = frame(app, 9, 'Pop the balloons in the right order to spell the word!');
  f.root.querySelector('.step-head').remove();
  const layer = el('<div class="balloon-layer"></div>');
  const card = el(`<div class="spell-card">
      <div class="sp-picbox"><div class="sp-pic"></div><div class="sp-word"></div></div>
      <div class="sp-side"><div class="sp-slots"></div>
        <div class="sp-tools"><button class="speaker" aria-label="Hear it again">🔊</button><button class="tool sp-show" aria-label="Show the word" aria-pressed="false">🔤</button>${caseToggleHTML()}</div></div></div>`);
  app.append(layer, card);
  $('.speaker', card).addEventListener('click', () => { Sound.ensure(); sayItem(target); });
  const showBtn = $('.sp-show', card);
  showBtn.addEventListener('click', () => { const on = card.classList.toggle('show-word'); showBtn.setAttribute('aria-pressed', on); showBtn.classList.toggle('on', on); Sound.click(); });
  bindCaseToggle($('.case-toggle', card), lower => { card.classList.toggle('lower', lower); layer.classList.toggle('lower', lower); });
  const slotsEl = $('.sp-slots', card);
  const isLetter = ch => !/[\s\-'.]/.test(ch);
  const skipNonLetters = () => { while (idx < chars.length && !isLetter(chars[idx])) idx++; };

  function round(){
    if (r >= rounds.length){ active = false; return finishStep(9, mistakes <= 1 ? 3 : mistakes <= 5 ? 2 : 1, `You spelled ${rounds.length} words!`); }
    target = rounds[r]; chars = [...target.word.toUpperCase()]; idx = 0; skipNonLetters();
    $('.sp-pic', card).innerHTML = pic(target); $('.sp-word', card).textContent = target.word;
    slotsEl.innerHTML = chars.map((ch, i) => isLetter(ch) ? `<div class="slot" data-i="${i}"></div>` : `<div class="slot space"></div>`).join('');
    const nLetters = chars.filter(isLetter).length;
    card.style.setProperty('--need', (nLetters * 38 + (chars.length - nLetters) * 14 + (chars.length - 1) * 5 + 26) + 'px');
    layer.innerHTML = ''; balloons = [];
    const letters = chars.filter(isLetter);
    const alpha = /^[A-Z]+$/.test(letters.join('')) ? 'ABCDEFGHIJKLMNOPRSTUVWY' : letters.join('');
    const extra = shuffle([...alpha].filter(c => !letters.includes(c))).slice(0, 3);
    const pool = shuffle(letters.concat(extra));
    const W = layer.clientWidth, H = layer.clientHeight;
    pool.forEach((ch, k) => {
      const node = el(`<button class="balloon" style="--bc:${COLORS[k % COLORS.length]}" aria-label="Letter ${esc(ch)}"><div class="bb">${esc(ch)}</div></button>`);
      layer.appendChild(node);
      const w = node.offsetWidth, h = node.offsetHeight;
      const span = W - w - 16, cycle = H + h + 90;
      const b = { node, ch, w, h, cycle,
        f: pool.length > 1 ? Math.min(1, Math.max(0, (k + rand(-.12, .12)) / (pool.length - 1))) : .5,
        y: H - ((k * .618034) % 1) * cycle,
        speed: H / 11, amp: rand(10, 20), freq: rand(.55, .8), ph: rand(0, 6.28), popped:false };
      b.x = 8 + b.f * span; balloons.push(b);
      node.addEventListener('pointerdown', e => { e.preventDefault(); Sound.ensure(); popBalloon(b); });
    });
    active = true;
    later(() => sayItem(target), 300);
  }
  function popBalloon(b){
    if (!active || b.popped) return;
    if (b.ch === chars[idx]){
      b.popped = true; b.node.classList.add('popped'); Sound.pop(); shards(b);
      setTimeout(() => b.node.remove(), 320);
      const s = $(`.slot[data-i="${idx}"]`, slotsEl); s.textContent = chars[idx]; flash(s, 'filled');
      idx++; skipNonLetters();
      if (idx >= chars.length){ active = false; later(() => { Sound.correct(); sayItem(target); }, 250); r++; later(round, 1900); }
    } else {
      Sound.wrong();
      mistakes++; flash(b.node, 'err');
    }
  }
  function shards(b){
    const cx = b.x + b.w / 2, cy = b.y + b.h * .45, col = b.node.style.getPropertyValue('--bc');
    for (let k = 0; k < 12; k++){
      const a = k / 12 * 6.28, d = rand(55, 95);
      const s = el(`<span class="shard" style="left:${cx}px;top:${cy}px;background:${col};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px"></span>`);
      layer.appendChild(s); setTimeout(() => s.remove(), 650);
    }
  }
  animLoop(dt => {
    clock += dt;
    const W = layer.clientWidth;
    const lr = layer.getBoundingClientRect(), cr = card.getBoundingClientRect();
    const box = { l: cr.left - lr.left - 18, r: cr.right - lr.left + 18, t: cr.top - lr.top - 20, b: cr.bottom - lr.top + 20 };
    const ease = t => t * t * (3 - 2 * t);
    for (const b of balloons){
      if (b.popped) continue;
      b.y -= b.speed * dt;
      if (b.y < -(b.h + 90)) b.y += b.cycle;
      let t = 0;
      if (b.y + b.h < box.t) t = Math.max(0, 1 - (box.t - (b.y + b.h)) / 60);
      else if (b.y <= box.b) t = 1;
      else if (b.y < box.b + 170) t = 1 - (b.y - box.b) / 170;
      t = ease(t);
      const full = 8 + b.f * (W - b.w - 16);
      const right = W - b.w - 8, squeezed = box.r < right - b.w ? box.r + b.f * (right - box.r) : full;
      b.x = full + (squeezed - full) * t + Math.sin(clock * b.freq + b.ph) * b.amp * (1 - .5 * t);
      b.node.style.transform = `translate3d(${b.x}px, ${b.y}px, 0)`;
    }
  });
  later(round, 50);
}

/* =======================================================================
   STEP 10 — HIDDEN TREASURE GRID (Team Fox vs Team Owl)
   ======================================================================= */
function step10(app){
  const kinds = shuffle(['gem','gem','gem','star','star','fox','fox','owl','owl','coin','coin','coin','coin','coin','coin','coin']);
  const PRIZE = { gem:{ e:'💎', pts:3, txt:'a treasure gem' }, star:{ e:'⭐', pts:2, txt:'a golden star' }, coin:{ e:'🪙', pts:1, txt:'a gold coin' } };
  const scores = { fox:0, owl:0 }; let turn = Math.random() < .5 ? 'fox' : 'owl', opened = 0, busy = false, bag = [];
  const nextItem = () => { if (!bag.length) bag = shuffle(vocab); return bag.pop(); };
  const teamName = t => t === 'fox' ? 'Team Fox' : 'Team Owl';
  const f = frame(app, 10, 'Team Fox 🦊 vs Team Owl 🦉! Take turns: pick a square, answer the question, and see what treasure is hiding underneath.');
  f.addTool('<button class="tool" aria-label="New game">🔄</button>', () => go(10));
  const team = t => `<div class="tg-team" data-team="${t}">${mascot(t, 'tg-m')}<div class="tg-name">${teamName(t)}</div><div class="tg-score">0</div></div>`;
  f.body.innerHTML = `<div class="tg">${team('fox')}
      <div class="tg-center"><div class="tg-grid">${kinds.map((k, i) => `<button class="tile" data-i="${i}" aria-label="Square ${i + 1}"><div class="tile-in"><div class="tile-front">${i + 1}</div><div class="tile-back"></div></div></button>`).join('')}</div></div>
      ${team('owl')}<div class="tg-q hidden"></div></div>`;
  const q = $('.tg-q', f.body), tiles = $$('.tile', f.body);
  function board(bump){
    $$('.tg-team', f.body).forEach(t => { const k = t.dataset.team; t.classList.toggle('active', k === turn); const s = $('.tg-score', t); s.textContent = scores[k]; if (bump === k) flash(s, 'bump'); });
  }
  function switchTurn(){ turn = turn === 'fox' ? 'owl' : 'fox'; busy = false; board(); }
  tiles.forEach(tile => tile.addEventListener('click', () => {
    if (busy || tile.classList.contains('open')) return;
    busy = true; tile.classList.add('picked'); Sound.click(); ask(tile);
  }));
  function ask(tile){
    const it = nextItem(), type = Math.random() < .5 ? 'see' : 'hear', opts = optionsFor(it, Math.min(3, vocab.length));
    q.classList.remove('hidden');
    q.innerHTML = `<div class="tgq-card ${turn}">${mascot(turn, 'tgq-m')}
      ${type === 'see'
        ? `<div class="tgq-pic">${pic(it)}</div><div class="tgq-opts">${opts.map(o => `<button class="opt" data-id="${o.id}">${esc(o.word)}</button>`).join('')}</div>`
        : `<button class="speaker huge" aria-label="Play the word">🔊</button><div class="tgq-opts pics">${opts.map(o => `<button class="opt pic-opt" data-id="${o.id}" aria-label="Picture option">${pic(o)}</button>`).join('')}</div>`}
    </div>`;
    if (type === 'hear'){ later(() => sayItem(it), 350); $('.speaker', q).addEventListener('click', () => sayItem(it)); }
    $$('.opt', q).forEach(b => b.addEventListener('click', () => {
      $$('.opt', q).forEach(o => o.disabled = true);
      if (+b.dataset.id === it.id){
        b.classList.add('good'); Sound.correct(); if (type === 'see') sayItem(it);
        later(() => { q.classList.add('hidden'); reveal(tile); }, 900);
      } else {
        b.classList.add('bad'); Sound.wrong(); $(`.opt[data-id="${it.id}"]`, q).classList.add('good'); sayItem(it);
        later(() => { q.classList.add('hidden'); tile.classList.remove('picked'); switchTurn(); }, 1800);
      }
    }));
  }
  function reveal(tile){
    const k = kinds[+tile.dataset.i];
    $('.tile-back', tile).innerHTML = (k === 'fox' || k === 'owl') ? mascot(k) : PRIZE[k].e;
    tile.classList.remove('picked'); tile.classList.add('open'); opened++;
    let who = turn, pts, msg;
    if (k === 'fox' || k === 'owl'){ who = k; pts = 2; msg = `${k === 'fox' ? '🦊' : '🦉'} +2`; }
    else { pts = PRIZE[k].pts; msg = `${PRIZE[k].e} +${pts}`; }
    scores[who] += pts; Sound.coin(); if (k === 'gem') Confetti.burst(60);
    toast(msg, 1800); board(who);
    if (opened === kinds.length){
      later(() => {
        const w = scores.fox === scores.owl ? null : scores.fox > scores.owl ? 'fox' : 'owl';
        finishStep(10, 3, w ? `${w === 'fox' ? '🦊' : '🦉'} <b>${teamName(w)}</b> wins ${Math.max(scores.fox, scores.owl)} – ${Math.min(scores.fox, scores.owl)}! Great teamwork, everyone!`
                            : `It's a tie, ${scores.fox} – ${scores.owl}! Both teams are treasure hunters!`);
      }, 1500);
    } else later(switchTurn, 1300);
  }
  board();
}

let teacherUnlocked = false, draft = null, confirmReset = false;
const tCard = () => $('#teacher .teacher-card');
function openTeacher(){
  confirmReset = false;
  $('#teacher').classList.remove('hidden');
  if (teacherUnlocked) return renderEditor();
  const a = 5 + randInt(5), b = 4 + randInt(6);
  tCard().innerHTML = `<div class="t-lock"><div class="big-emoji">🍎🔒</div><h2>Teacher Mode</h2><p>Grown-ups only! What is <b>${a} × ${b}</b>?</p>
    <input id="tAns" type="number" inputmode="numeric" aria-label="Answer"><br>
    <button class="btn" id="tUnlock">Unlock</button> <button class="btn alt" id="tCancel">Cancel</button><p class="t-msg" id="tLockMsg"></p></div>`;
  const inp = $('#tAns'); setTimeout(() => inp.focus(), 50);
  const tryUnlock = () => { if (+inp.value === a * b){ teacherUnlocked = true; Sound.correct(); renderEditor(); } else { Sound.wrong(); $('#tLockMsg').textContent = 'Not quite — try again!'; inp.select(); } };
  $('#tUnlock').addEventListener('click', tryUnlock);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

function closeTeacher(){ confirmReset = false; $('#teacher').classList.add('hidden'); draft = null; $$('#app .critter').forEach(applyBookPos); }

function exportJsonPack(){
  const cleanWords = draft.words
    .map((w, i) => ({
      word: String(w.word||'').trim(),
      say: String(w.say||'').trim(),
      emoji: String(w.emoji||'').trim() || '⭐',
      img: String(w.img||'').trim() || `images/${slug(String(w.word||'').trim()) || (i + 1)}.jpg`
    }))
    .filter(w => w.word);
  if (cleanWords.length < MIN_WORDS || cleanWords.length > MAX_WORDS){
    return renderEditor(`Please include ${MIN_WORDS} to ${MAX_WORDS} valid words before exporting JSON.`);
  }
  const payload = {
    topic: String(draft.topic||'').trim() || 'Custom Pack',
    words: cleanWords,
    book: bookPos()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${slug(payload.topic) || 'word-quest-pack'}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  renderEditor(`📦 Exported ${a.download} (${cleanWords.length} words) — upload it with your images/ folder to GitHub!`, true);
}

async function applyPackObject(raw, sourceLabel='JSON pack'){
  const res = validatePackData(raw);
  if (res.error) return { ok:false, error:res.error };
  if (res.data.book) lsSet(LS.book, res.data.book);
  if (!lsSet(LS.data, { topic:res.data.topic, words:res.data.words })) {
    return { ok:false, error:'Browser storage is full — try smaller images or image URLs.' };
  }
  draft = { topic:res.data.topic, words:res.data.words.map(w => ({...w})) };
  await applyVocab({ topic:res.data.topic, words:res.data.words }, `${sourceLabel} loaded ✓`);
  return { ok:true };
}

async function loadPackFromUrl(urlStr){
  const trimmed = String(urlStr || '').trim();
  if (!trimmed) return { ok:false, error:'Please enter a JSON URL.' };
  const resp = await fetch(trimmed, { cache:'no-store' });
  if (!resp.ok) return { ok:false, error:`Could not fetch JSON (${resp.status}).` };
  const json = await resp.json();
  return applyPackObject(json, 'GitHub pack');
}

    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const res = await applyPackObject(parsed, file.name);
      if (!res.ok) renderEditor(res.error);
    } catch(_){
      renderEditor('Could not read or parse that JSON file.');
    }
  });
  $$('.t-row', card).forEach(rw => {
    const i = +rw.dataset.i, w = draft.words[i];
    $$('input[data-f]', rw).forEach(inp => {
      if (inp.dataset.f === 'file'){
        inp.addEventListener('change', async () => {
          const file = inp.files[0]; if (!file) return;
          try { w.img = await fileToDataURL(file); renderEditor('📷 Picture added — remember to Save.', true); }
          catch(e){ renderEditor('Sorry, that file could not be read as an image.'); }
        });
      } else inp.addEventListener('input', () => {
        if (inp.dataset.f === 'say') w._sayEdited = true;
        if (inp.dataset.f === 'word' && !w._sayEdited){ w.say = inp.value; $('input[data-f=say]', rw).value = inp.value; }
        w[inp.dataset.f] = inp.value; if (inp.dataset.f === 'emoji' && !w.img) $('.t-thumb', rw).textContent = inp.value || '⭐'; });
    });
  });
  bindBookTuner(card);
  card.onclick = async e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    const rw = b.closest('.t-row'), i = rw ? +rw.dataset.i : -1, t = b.dataset.t;
    if (t === 'close') closeTeacher();
    else if (t === 'add' && draft.words.length < MAX_WORDS){ draft.words.push({ word:'', say:'', emoji:'⭐', img:'' }); renderEditor(); $$('.t-row input[data-f=word]', tCard()).pop().focus(); }
    else if (t === 'del'){ draft.words.splice(i, 1); renderEditor(); }
    else if (t === 'clearimg'){ draft.words[i].img = ''; renderEditor(); }
    else if (t === 'speak'){ const w = draft.words[i]; const was = Sound.muted; Sound.muted = false; Voice.say(w.say || w.word); Sound.muted = was; }
    else if (t === 'exportjson') exportJsonPack();
    else if (t === 'loadurl'){
      const u = $('#tJsonUrl', card)?.value || '';
      const res = await loadPackFromUrl(u);
      if (!res.ok) renderEditor(res.error);
    }
    else if (t === 'bookreset'){ lsDel(LS.book); renderEditor('Book text positions reset ✓', true); }
    else if (t === 'stars'){ lsDel(LS.stars); renderNav(); renderEditor('Stars cleared.', true); }
    else if (t === 'reset'){ confirmReset = true; renderEditor(); }
    else if (t === 'resetcancel'){ confirmReset = false; renderEditor(); }
    else if (t === 'resetconfirm'){
      confirmReset = false;
      lsDel(LS.data);
      draft = { topic:DEFAULT_TOPIC, words: DEFAULT_VOCAB.map(v => ({...v})) };
      await applyVocab(draft, 'Reset to School Subjects ✓');
    }
    else if (t === 'save') saveTeacher();
  };
}

let bookTunerOpen = false;
function bookTunerHTML(){
  const pos = bookPos(), sample = (draft.words.map(w => w.word || '').sort((a, b) => b.length - a.length)[0]) || 'geography';
  const slider = (k, p, label, min, max) => `<label>${label}<input type="range" min="${min}" max="${max}" step="0.5" value="${pos[k][p]}" data-k="${k}" data-p="${p}"></label>`;
  return `<details class="t-book" ${bookTunerOpen ? 'open' : ''}><summary>📍 Step 2: adjust the word position on the fox &amp; owl books</summary>
    <div class="t-book-grid">${['fox', 'owl'].map(k => `<div class="t-book-item">${critterHTML(k, sample)}<div class="t-sliders">
      ${slider(k, 'x', '↔ Left / right', 5, 95)}${slider(k, 'y', '↕ Up / down', 5, 98)}${slider(k, 's', '🔠 Text size', 40, 170)}${slider(k, 'r', '⟲ Tilt', -25, 25)}
    </div></div>`).join('')}</div>
    <p style="margin:8px 0;font-size:14px;color:var(--ink-soft)">Changes are saved automatically. The preview uses your longest word.</p>
    <button class="btn alt small" data-t="bookreset">↺ Reset positions</button></details>`;
}
function bindBookTuner(card){
  const det = $('.t-book', card); if (!det) return;
  det.addEventListener('toggle', () => bookTunerOpen = det.open);
  $$('.t-book .critter', card).forEach(c => { applyBookPos(c); setBookWord(c, $('.book-text', c).textContent); });
  $$('.t-book input[type=range]', card).forEach(inp => inp.addEventListener('input', () => {
    const saved = lsGet(LS.book, {}) || {}, k = inp.dataset.k;
    saved[k] = { ...(saved[k] || {}), [inp.dataset.p]: +inp.value }; lsSet(LS.book, saved);
    applyBookPos($(`.t-book .critter[data-kind="${k}"]`, card));
  }));
}
async function saveTeacher(){
  const words = draft.words.map(w => ({ word:(w.word||'').trim(), say:(w.say||'').trim(), emoji:(w.emoji||'').trim() || '⭐', img:(w.img||'').trim() })).filter(w => w.word);
  if (words.length < MIN_WORDS || words.length > MAX_WORDS){
    return renderEditor(`Please include ${MIN_WORDS} to ${MAX_WORDS} words (you have ${words.length}).`);
  }
  const seen = new Set();
  for (const w of words){ const k = w.word.toLowerCase(); if (seen.has(k)) return renderEditor(`"${w.word}" appears twice — each word must be different.`); seen.add(k); }
  const data = { topic:(draft.topic||'').trim() || 'My Words', words };
  if (!lsSet(LS.data, data)) return renderEditor('⚠️ Browser storage is full — try smaller pictures or image URLs instead.');
  await applyVocab(data, 'Saved ✓');
}
async function applyVocab(data, msg){
  topic = data.topic; setVocab(data.words); await resolveAssets();
  closeTeacher(); toast(`🍎 ${msg}`); go(current === 0 ? 0 : current);
}
function fileToDataURL(file, max=360){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s));
        const x = c.getContext('2d'), alpha = /png|gif|webp|svg/.test(file.type);
        if (!alpha){ x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
        x.drawImage(im, 0, 0, c.width, c.height);
        res(alpha ? c.toDataURL('image/webp', .85) : c.toDataURL('image/jpeg', .85));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* =======================================================================
9. GLOBAL CONTROLS & BOOT
   ======================================================================= */
function updateMuteIcon(){ $('#muteBtn').textContent = Sound.muted ? '🔇' : '🔊'; }
$('#homeBtn').addEventListener('click', () => { Sound.click(); go(0); });
$('#stepnav').addEventListener('click', e => { const b = e.target.closest('.navbtn'); if (b){ Sound.click(); go(+b.dataset.n); } });
$('#muteBtn').addEventListener('click', () => { Sound.muted = !Sound.muted; lsSet(LS.mute, Sound.muted); if (Sound.muted && Voice.ok) speechSynthesis.cancel(); updateMuteIcon(); Sound.click(); });
$('#fsBtn').addEventListener('click', () => {
  const d = document;
  if (!d.fullscreenElement && !d.webkitFullscreenElement){ const r = d.documentElement; (r.requestFullscreen || r.webkitRequestFullscreen)?.call(r); }
  else (d.exitFullscreen || d.webkitExitFullscreen)?.call(d);
});
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('present', !!document.fullscreenElement));
$('#teacherBtn').addEventListener('click', () => { Sound.click(); openTeacher(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#teacher').classList.contains('hidden')) closeTeacher(); });
document.addEventListener('pointerdown', () => Sound.ensure(), { once:true });

(async function boot(){
  const syncTop = () => document.documentElement.style.setProperty('--top', $('#topbar').offsetHeight + 'px');
  syncTop(); if (window.ResizeObserver) new ResizeObserver(syncTop).observe($('#topbar'));
  Voice.init(); updateMuteIcon(); loadSaved(); renderNav();
  $('#app').innerHTML = '<div class="center-msg panel"><div class="big-emoji">🌟</div><h2>Loading…</h2></div>';

  // Optional GitHub Pages / student link pack via ?pack=..., ?json=..., or ?lesson=...
  const params = new URLSearchParams(location.search);
  const packParam = params.get('pack') || params.get('json') || params.get('lesson');
  if (packParam){
    try {
      const resp = await fetch(packParam, { cache:'no-store' });
      if (resp.ok){
        const raw = await resp.json();
        const check = validatePackData(raw);
        if (!check.error){
          if (check.data.book) lsSet(LS.book, check.data.book);
          lsSet(LS.data, { topic:check.data.topic, words:check.data.words });
          topic = check.data.topic;
          setVocab(check.data.words);
        }
      }
    } catch(_){}
  }

  await resolveAssets();
  const m = location.hash.match(/step(\d+)/);
  go(m ? Math.min(10, Math.max(1, +m[1])) : 0);
})();
</script>
