<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Quest — Vocabulary Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
1. THEME & BASE
   ===================================================================== */
:root{
  --ink:#2d2350; --ink-soft:#5b5480; --paper:#fffdf6; --glass:rgba(255,253,246,.9);
  --primary:#7c4dff; --primary-d:#5a32c9; --sun:#ffc93c; --sun-d:#d9a514;
  --mint:#20c997; --mint-d:#12936e; --coral:#ff6b6b; --coral-d:#d94848; --sky:#4dabf7;
  --radius:22px; --shadow:0 10px 30px rgba(45,35,80,.18),0 2px 6px rgba(45,35,80,.12);
  --top:70px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Fredoka','Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;color:var(--ink);
  background-color:#8fd3ff;
  /* Image first; if background.jpg is missing the gradient layer shows through */
  background-image:url('background.jpg'),linear-gradient(160deg,#8fd3ff 0%,#c3b5ff 45%,#ffd6e7 100%);
  background-size:cover;background-position:center;background-attachment:fixed;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
body.forest{background-image:url('forest.jpg'),linear-gradient(180deg,#1f5130 0%,#3f8a46 50%,#a8d672 100%)}
button{font-family:inherit;color:inherit}
input{font-family:inherit;user-select:text;-webkit-user-select:text}
.hidden{display:none!important}

/* =====================================================================
2. TOP BAR / NAVIGATION (all menus live up here, away from gameplay)
   ===================================================================== */
#topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(0,0,0,.12);min-height:var(--top)}
.brand{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;font-weight:700;font-size:22px;padding:6px 10px;border-radius:16px;white-space:nowrap}
.brand:hover,.brand.active{background:#f1ebff}
.brand .logo{font-size:28px;display:inline-block}
#stepnav{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:4px 2px}
#stepnav::-webkit-scrollbar{display:none}
.navbtn{flex:0 0 auto;width:54px;height:54px;border-radius:16px;border:3px solid transparent;background:#fff;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  box-shadow:0 3px 0 #ddd3f5;transition:transform .15s,border-color .15s;position:relative}
.navbtn:hover{transform:translateY(-2px)}
.navbtn .ni{font-size:20px}
.navbtn .nn{font-size:12px;font-weight:700;margin-top:2px}
.navbtn .ns{font-size:9px;color:#f5a524;height:9px;letter-spacing:-1px}
.navbtn.active{border-color:var(--primary);background:#f4efff;transform:translateY(-2px)}
.navbtn.done{background:linear-gradient(#fffbe6,#ffe8a3)}
.navbtn.done.active{background:linear-gradient(#f4efff,#ffe8a3)}
.tools{display:flex;gap:8px}
.tool{width:46px;height:46px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 #ddd3f5;font-size:21px;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.tool:hover{transform:scale(1.08)}
body.present .brand .bt{display:none}

/* =====================================================================
3. GENERIC UI
   ===================================================================== */
#app{min-height:calc(100vh - var(--top));min-height:calc(100dvh - var(--top));padding:14px;display:flex;flex-direction:column}
.panel{background:var(--glass);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.btn{font-weight:600;border:none;border-radius:999px;padding:10px 20px;font-size:18px;cursor:pointer;background:var(--primary);color:#fff;
  box-shadow:0 5px 0 var(--primary-d);transition:transform .1s,box-shadow .1s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--primary-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 #d6cfee}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.btn.green{background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.btn.red{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)}
.btn.small{font-size:14px;padding:7px 12px}
.btn.big{font-size:26px;padding:14px 34px}
.speaker{width:50px;height:50px;border-radius:50%;border:none;background:var(--sun);font-size:24px;cursor:pointer;box-shadow:0 4px 0 var(--sun-d);transition:transform .15s}
.speaker:hover{transform:scale(1.1) rotate(-6deg)}
.speaker.huge{width:120px;height:120px;font-size:60px;box-shadow:0 7px 0 var(--sun-d)}
.pill{background:#fff;border-radius:999px;padding:7px 16px;font-weight:700;box-shadow:0 3px 0 #e4ddf5;font-size:18px;white-space:nowrap}
.big-emoji{font-size:72px;line-height:1}
.center-msg{text-align:center;max-width:560px;margin:40px auto}

/* Picture tile: image if available, otherwise a colourful emoji illustration */
.pic{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;container-type:inline-size;display:grid;place-items:center;
  background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.9) 0 7%,transparent 8%),
             radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 30%,white),var(--c));
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;background:#fff}
.pic .emo{font-size:58cqw;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.22));pointer-events:none}
.mascot{display:block;object-fit:contain;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.emo-mascot{display:grid;place-items:center;line-height:1}

/* Step frame */
.step{flex:1;display:flex;flex-direction:column;gap:12px;max-width:1320px;width:100%;margin:0 auto;animation:fade-up .4s}
.step-head{display:flex;align-items:center;gap:12px 16px;background:var(--glass);border-radius:var(--radius);padding:10px 16px;box-shadow:var(--shadow);flex-wrap:wrap}
.step-head h2{margin:0;font-size:clamp(20px,2.3vw,30px);display:flex;align-items:center;gap:8px;white-space:nowrap}
.step-head h2 small{font-size:.55em;background:var(--primary);color:#fff;padding:3px 10px;border-radius:999px}
.step-head p{margin:0;color:var(--ink-soft);flex:1;min-width:220px;font-size:clamp(14px,1.4vw,18px)}
.head-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step-body{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}

/* Overlay / modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(30,20,60,.5);display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ov-card{background:var(--paper);border-radius:30px;padding:26px 30px;text-align:center;max-width:580px;width:100%;box-shadow:var(--shadow);animation:pop-in .5s cubic-bezier(.2,1.6,.4,1)}
.ov-card h2{margin:8px 0;font-size:36px}
.ov-card p{font-size:19px;color:var(--ink-soft)}
.ov-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.stars{white-space:nowrap}
.stars i{font-style:normal;color:#d9d3ea}
.stars i.on{color:#ffb800}
.stars-big i{font-size:64px;display:inline-block;text-shadow:0 4px 0 rgba(0,0,0,.08)}
.stars-big i.on{animation:star-in .6s cubic-bezier(.2,1.8,.4,1) backwards}
.stars-big i:nth-child(2){animation-delay:.2s}.stars-big i:nth-child(3){animation-delay:.4s}
.toast{position:fixed;left:50%;top:calc(var(--top) + 20px);transform:translateX(-50%);z-index:95;background:#fff;padding:12px 26px;border-radius:999px;font-size:22px;font-weight:600;box-shadow:var(--shadow);animation:toast-in .4s cubic-bezier(.2,1.6,.4,1);pointer-events:none;text-align:center}
.toast.out{opacity:0;transform:translate(-50%,-20px);transition:.4s}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}
.opt{font-size:clamp(18px,2vw,26px);font-weight:600;padding:12px 22px;border-radius:18px;border:4px solid #fff;background:#fff;cursor:pointer;box-shadow:0 5px 0 #d6cfee;transition:transform .15s,background .2s}
.opt:hover{transform:translateY(-3px)}
.opt.good{background:#b2f2bb;border-color:#40c057;animation:bounce .5s}
.opt.bad{background:#ffc9c9;border-color:#fa5252;animation:err-glow .9s ease-out;opacity:.6;transition:opacity .4s}
.opt:disabled{cursor:default}

/* =====================================================================
4. HOME SCREEN
   ===================================================================== */
.home{max-width:1200px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px;animation:fade-up .5s}
.hero{text-align:center;position:relative;padding:20px 20px 24px}
.hero h1{font-size:clamp(40px,6vw,72px);margin:0;color:var(--primary);text-shadow:0 4px 0 #e0d4ff,0 8px 18px rgba(124,77,255,.25);letter-spacing:1px}
.hero .topic{font-size:20px;margin:4px 0 14px;color:var(--ink-soft)}
.hero-m{position:absolute;width:clamp(70px,10vw,130px);height:clamp(70px,10vw,130px);font-size:clamp(56px,8vw,100px);top:14px}
.hero-m.l{left:16px}.hero-m.r{right:16px;animation-delay:-1.5s}
.word-strip{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0 16px}
.mini-word{border:none;background:#fff;border-radius:16px;padding:6px;width:96px;cursor:pointer;box-shadow:0 4px 0 #e4ddf5;transition:transform .15s}
.mini-word:hover{transform:translateY(-4px) rotate(-2deg)}
.mini-word .pic{border-radius:12px}
.mini-word span{display:block;font-weight:600;font-size:15px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:16px;font-weight:600;flex-wrap:wrap}
.progress .bar{width:min(380px,70vw);height:18px;background:#ece6fb;border-radius:999px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:999px;transition:width .6s}
.step-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.step-card{border:none;background:var(--glass);border-radius:22px;padding:16px 10px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.step-card:hover{transform:translateY(-5px) scale(1.02)}
.sc-icon{font-size:44px}
.sc-n{font-size:13px;background:var(--primary);color:#fff;border-radius:999px;padding:2px 10px}
.sc-t{font-weight:700;font-size:19px}
.sc-stars{font-size:22px}
/* Main menu fits the screen exactly (no scrolling): everything scales with the viewport height */
.home{height:calc(100vh - var(--top) - 28px);height:calc(100dvh - var(--top) - 28px);gap:1.6vh;overflow:hidden}
.hero{flex:0 0 auto;padding:1.6vh 20px 2vh}
.hero h1{font-size:clamp(28px,min(7vh,6vw),72px);line-height:1.1}
.hero .topic{font-size:clamp(13px,2.2vh,20px);margin:.4vh 0 1.2vh}
.hero-m{width:clamp(56px,13vh,130px);height:clamp(56px,13vh,130px);font-size:clamp(44px,10vh,100px);top:1.4vh}
.word-strip{gap:min(1.1vh,9px);margin:.6vh 0 1.4vh;flex-wrap:nowrap}
.mini-word{width:clamp(48px,min(9.5vh,8vw),92px);padding:min(.65vh,6px);border-radius:14px;flex:0 1 auto}
.mini-word span{font-size:clamp(10px,1.7vh,14px);margin-top:.4vh}
.progress{margin-bottom:1.4vh;font-size:clamp(12px,2vh,16px)}
.progress .bar{height:clamp(8px,1.8vh,18px)}
.home .btn.big{font-size:clamp(16px,3.1vh,26px);padding:clamp(6px,1.4vh,14px) 34px}
.step-grid{flex:1;min-height:0;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.6vh}
.step-card{padding:.8vh 6px;gap:.3vh;justify-content:center;min-height:0;overflow:hidden}
.sc-icon{font-size:clamp(20px,min(5.2vh,4vw),46px);line-height:1}
.sc-n{font-size:clamp(10px,1.6vh,13px)}
.sc-t{font-size:clamp(12px,min(2.3vh,1.8vw),20px);text-align:center;line-height:1.15}
.sc-stars{font-size:clamp(13px,2.4vh,22px);line-height:1}

/* =====================================================================
5. STEP 1 — FLASHCARDS
   ===================================================================== */
.fc-wrap{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,40px)}
.arrow{width:70px;height:70px;border-radius:50%;border:none;background:#fff;font-size:30px;cursor:pointer;box-shadow:0 5px 0 #d6cfee;color:var(--primary);flex:0 0 auto;transition:transform .15s}
.arrow:hover{transform:scale(1.1)}
.fc-stage{height:calc(100vh - var(--top) - 96px);max-height:940px;aspect-ratio:4/5;max-width:calc(100vw - 190px);perspective:1000px;perspective-origin:50% 40%}
.flashcard{width:100%;height:100%;position:relative;cursor:pointer;outline:none;transform-style:preserve-3d}
.flashcard.in-right{animation:in-right .45s cubic-bezier(.2,1.3,.4,1)}
.flashcard.in-left{animation:in-left .45s cubic-bezier(.2,1.3,.4,1)}
.fc-inner{position:absolute;inset:0;transform-style:preserve-3d}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{--bw:8px}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;background:#fff;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border:8px solid #fff;outline:3px dashed #e8e0ff;outline-offset:-18px}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,#fff8e1,#ffe0f0)}
.fc-pic{width:94%}
.fc-pic-back{width:74%}
.fc-word{font-size:calc(clamp(34px,7vh,72px) * var(--fit,1));font-weight:700;line-height:1.1;text-align:center}
.flashcard.flipped .fc-word{animation:letter-hop .6s .3s backwards}
.fc-dots{display:flex;gap:8px;justify-content:center;padding:8px}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff;background:#d6cfee;cursor:pointer;padding:0}
.dot.seen{background:var(--sun)}
.dot.on{background:var(--primary);transform:scale(1.3)}

/* =====================================================================
6. STEP 2 — FOREST SORTING
   ===================================================================== */
.forest-game{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;min-height:500px;gap:6px}
.target-slot{width:clamp(170px,30vh,330px);aspect-ratio:1;position:relative;margin-top:12px;z-index:10}
.target-slot::before{content:'';position:absolute;inset:-12px;border-radius:30px;border:3px dashed rgba(255,255,255,.85);box-shadow:0 0 18px rgba(255,255,255,.45),inset 0 0 18px rgba(255,255,255,.35)}
.drag-card{position:relative;width:100%;height:100%;padding:8px;border-radius:24px;cursor:grab;touch-action:none;animation:drop-in .6s cubic-bezier(.2,1.5,.4,1);z-index:5}
.drag-card.dragging{cursor:grabbing;z-index:30;box-shadow:0 0 0 3px rgba(255,221,110,.95),0 0 30px rgba(255,200,60,.7),0 24px 40px rgba(0,0,0,.35)!important}
.drag-card .pic{width:100%;height:100%}
.drag-card.err{animation:err-glow .9s ease-out}
/* Large mascots; the answer word is printed straight onto the book in each image */
.critters{display:flex;justify-content:space-around;align-items:flex-end;width:100%;gap:2vw}
.critter{--ch:min(44vh,42vw,560px);--bx:50;--by:85;--bs:100;--br:0;position:relative;height:var(--ch);display:inline-block;isolation:isolate;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.critter img{height:100%;width:auto;display:block;filter:drop-shadow(0 12px 14px rgba(0,0,0,.35));transition:filter .3s;pointer-events:none}
.critter::before{content:'';position:absolute;inset:-4% -8%;border-radius:50%;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(closest-side,rgba(255,240,160,.85),rgba(255,200,80,.45) 55%,transparent)}
.critter.hover{transform:scale(1.05)}
.critter.hover::before{opacity:1}
.critter.hover img{filter:drop-shadow(0 0 12px rgba(255,240,170,1)) drop-shadow(0 0 34px rgba(255,190,60,.85))}
.critter.chomp{animation:chomp .9s}
.critter.err img{animation:err-glow-img .9s ease-out}
.book-text{position:absolute;left:calc(var(--bx) * 1%);top:calc(var(--by) * 1%);transform:translate(-50%,-50%) rotate(calc(var(--br) * 1deg));
  font-size:calc(var(--ch) * .1 * var(--bs) / 100 * var(--fit,1));font-weight:700;color:#3a1d06;white-space:nowrap;letter-spacing:.02em;line-height:1;pointer-events:none;
  text-shadow:0 0 4px rgba(255,250,232,1),0 0 10px rgba(255,246,220,.9),0 2px 0 rgba(255,255,255,.7)}
.book-text.ink{animation:ink-in .6s cubic-bezier(.2,1.4,.4,1)}
/* Emoji fallback when fox.png / owl.png are missing */
.emo-critter{width:calc(var(--ch) * 1.05);display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end}
.emo-big{font-size:calc(var(--ch) * .58);line-height:1;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
.fallback-book{width:82%;height:24%;margin-top:-3%;border:3px solid #8b5a2b;border-radius:10px 10px 18px 18px;background:linear-gradient(90deg,#efe1c0,#fffaf0 46%,#c9b48f 50%,#fffaf0 54%,#efe1c0)}
.sparkle{position:absolute;pointer-events:none;z-index:40;font-size:28px;animation:sparkle .9s forwards}
/* Grabbing the picture turns it into a cookie (picture printed in the middle) */
.drag-card .cookie{position:absolute;inset:2%;border-radius:50%;pointer-events:none;opacity:0;transform:scale(.25) rotate(-120deg);
  transition:transform .38s cubic-bezier(.2,1.5,.4,1),opacity .2s;
  background:
    radial-gradient(circle at 24% 30%,#4a2508 0 4.5%,transparent 5%),radial-gradient(circle at 74% 24%,#5a2f0e 0 4%,transparent 4.5%),
    radial-gradient(circle at 18% 66%,#4a2508 0 4.5%,transparent 5%),radial-gradient(circle at 82% 62%,#5a2f0e 0 5%,transparent 5.5%),
    radial-gradient(circle at 50% 88%,#4a2508 0 4%,transparent 4.5%),radial-gradient(circle at 36% 84%,#5a2f0e 0 3%,transparent 3.5%),
    radial-gradient(circle at 66% 85%,#4a2508 0 3.2%,transparent 3.7%),
    radial-gradient(circle at 50% 46%,#4a2508 0 5%,transparent 5.5%),radial-gradient(circle at 34% 54%,#5a2f0e 0 3.8%,transparent 4.3%),
    radial-gradient(circle at 64% 58%,#4a2508 0 4.2%,transparent 4.7%),radial-gradient(circle at 56% 70%,#5a2f0e 0 3%,transparent 3.5%),
    radial-gradient(circle at 38% 34%,#f6cd86,#dfa050 58%,#b9752e);
  box-shadow:inset -10px -12px 0 rgba(120,60,10,.22),inset 8px 8px 14px rgba(255,235,180,.55),0 14px 22px rgba(0,0,0,.32)}
.drag-card .pic{position:relative;z-index:1;transition:transform .38s cubic-bezier(.2,1.4,.4,1),border-radius .38s,box-shadow .38s}
.drag-card.cookie-mode{background:transparent!important;border-color:transparent!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.drag-card.cookie-mode .cookie{opacity:1;transform:scale(.55) rotate(0)}
.drag-card.cookie-mode .pic{transform:scale(.2);opacity:0;transition:transform .3s ease-in,opacity .2s}
.crumb{position:absolute;pointer-events:none;z-index:40;width:9px;height:9px;border-radius:40%;background:#b9752e;box-shadow:inset -2px -2px 0 rgba(80,40,5,.4);animation:sparkle .8s ease-out forwards}

/* =====================================================================
7. STEP 3 — WATER DROPS
   ===================================================================== */
.rain-layer{position:fixed;left:0;right:0;top:var(--top);bottom:0;z-index:5;overflow:hidden;pointer-events:none}
.rain-layer::after{content:'';position:absolute;left:0;right:0;bottom:0;height:70px;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,rgba(30,136,229,.45),rgba(30,136,229,.12) 70%,transparent 72%)}
.rain-card{position:fixed;left:14px;top:calc(var(--top) + 14px);z-index:6;width:clamp(170px,18vw,270px);padding:10px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:8px;
  background:var(--glass-2);backdrop-filter:var(--frost);-webkit-backdrop-filter:var(--frost);border:var(--glass-border);box-shadow:var(--glass-shadow)}
.rain-card .rt-pic{width:100%}
.rain-card .rt-pic .pic{animation:pop-in .5s cubic-bezier(.2,1.6,.4,1)}
.drop{position:absolute;left:0;top:0;width:clamp(96px,9vw,140px);aspect-ratio:100/120;border:none;background:none;padding:0;cursor:pointer;pointer-events:auto;touch-action:manipulation;will-change:transform;backface-visibility:hidden}
.drop svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(0,60,120,.25))}
.drop span{position:absolute;left:0;right:0;top:52%;text-align:center;font-weight:700;font-size:clamp(16px,1.6vw,22px);color:#063a6b;padding:0 6px;line-height:1.05;word-break:break-word}
.drop.gone{opacity:0;transition:opacity .12s}
.drop.land{opacity:0;transition:opacity .35s}
.drop.err svg{animation:err-glow-svg .9s ease-out}
.splash-ring{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;pointer-events:none;
  border:3px solid rgba(255,255,255,.9);box-shadow:0 0 12px rgba(140,210,255,.9),inset 0 0 10px rgba(140,210,255,.7);animation:splash-ring .75s cubic-bezier(.2,.7,.3,1) forwards}
.splash-ring.r2{animation-delay:.1s;border-color:rgba(170,225,255,.85);opacity:0;animation-name:splash-ring2}
@keyframes splash-ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(7,4.5);opacity:0}}
@keyframes splash-ring2{0%{transform:scale(.3);opacity:.9}100%{transform:scale(10,6);opacity:0}}
.wp{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;will-change:transform,opacity;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.98) 0 16%,rgba(185,232,255,.85) 38%,rgba(60,155,235,.65) 78%,rgba(30,120,220,.5));box-shadow:0 0 6px rgba(140,210,255,.7)}

/* =====================================================================
8. STEP 4 — SLOW REVEAL
   ===================================================================== */
.reveal{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,60px);flex-wrap:wrap}
.reveal-pic-wrap{position:relative;width:min(50vh,420px);background:#fff;padding:12px;border-radius:30px;box-shadow:var(--shadow);cursor:zoom-in}
.reveal-pic-wrap .clip{border-radius:20px;overflow:hidden}
.reveal-pic-wrap .pic{transition:filter .6s,transform .6s;border-radius:0}
.clarity{height:14px;border-radius:999px;background:#ece6fb;margin-top:12px;overflow:hidden}
.clarity i{display:block;height:100%;width:0;background:linear-gradient(90deg,#74c0fc,#20c997);transition:width .4s}
.reveal-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:min(90vw,380px)}

/* =====================================================================
9. STEP 5 — WORD SEARCH
   ===================================================================== */
.ws{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,40px);flex-wrap:wrap}
.ws-grid{--gw:min(calc(100vh - var(--top) - 110px),760px,92vw);display:grid;grid-template-columns:repeat(var(--n),1fr);gap:calc(var(--gw) / var(--n) * .07);width:var(--gw);padding:12px;background:var(--glass);border-radius:26px;box-shadow:var(--shadow);touch-action:none}
.ws-cell{aspect-ratio:1;border-radius:calc(var(--gw) / var(--n) * .2);background:#fff;display:grid;place-items:center;font-weight:700;font-size:calc(var(--gw) / var(--n) * .5);line-height:1;cursor:pointer;box-shadow:0 3px 0 #e4ddf5;transition:background .15s,transform .15s;color:var(--ink)}
.ws-cell.sel{background:var(--sun);transform:scale(1.06)}
.ws-cell.anchor{outline:4px solid var(--primary);outline-offset:-4px}
.ws-cell.found{color:#fff;animation:bounce .5s}
.ws-cell.err{animation:err-glow .9s ease-out}
.ws-side{min-width:220px;max-width:320px}
.ws .ws-cell,.ws .ws-item b,.chain .ch-l,.balloon .bb,.spell-card .slot,.sp-word{text-transform:uppercase}
.ws.lower .ws-cell,.ws.lower .ws-item b,.lower .ch-l,.lower .balloon .bb,.lower .slot,.lower .sp-word{text-transform:lowercase}
/* AA / aa segmented toggle */
.case-toggle{display:inline-flex;padding:4px;gap:4px;border-radius:999px;background:var(--glass);backdrop-filter:var(--frost);-webkit-backdrop-filter:var(--frost);border:var(--glass-border);box-shadow:var(--glass-shadow)}
.case-toggle button{border:none;background:none;font-weight:700;font-size:18px;min-width:52px;height:40px;border-radius:999px;cursor:pointer;color:var(--ink-soft);transition:background .2s,color .2s,box-shadow .2s}
.case-toggle button.on{background:var(--primary);color:#fff;box-shadow:0 0 14px rgba(124,77,255,.55)}
.case-toggle button:not(.on):hover{background:var(--glass-2)}
.ws-side h3{margin:0 0 10px}
.ws-item{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:14px;cursor:pointer}
.ws-side{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - var(--top) - 110px);overflow:auto}
.ws-item:hover{background:#fff}
.ws-item .pic{width:clamp(38px,6.2vh,64px);flex:0 0 auto;border-radius:12px}
.ws-item b{font-size:clamp(16px,2.4vh,22px)}
.ws-item.found b{text-decoration:line-through;text-decoration-thickness:3px;opacity:.6}
.ws-item.found::after{content:'✅';margin-left:auto;font-size:24px}
.ws-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;min-width:0;max-width:none;width:clamp(260px,28vw,400px)}
.ws-item{flex-direction:column;justify-content:center;gap:4px;padding:6px 4px;text-align:center;position:relative}
.ws-item .pic{width:clamp(48px,8.2vh,96px)}
.ws-item.found::after{position:absolute;top:4px;right:4px;margin:0;font-size:20px}

/* =====================================================================
10. STEP 6 — MEMORY MATCH
   ===================================================================== */
.mm{flex:1;display:flex;align-items:center;justify-content:center;min-height:420px}
.mm-grid{display:grid;justify-content:center;align-content:center}
.mm-card{aspect-ratio:3/2;border:none;background:none;padding:0;cursor:pointer;perspective:800px;container-type:inline-size;position:relative}
.mm-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.mm-back,.mm-front{--bw:5px}
.mm-card.open .mm-inner,.mm-card.matched .mm-inner{transform:rotateY(180deg)}
.mm-back,.mm-front{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.mm-back{background:radial-gradient(circle,rgba(255,255,255,.25) 2px,transparent 3px) 0 0/18px 18px,linear-gradient(135deg,#7c4dff,#ff6bb5);color:#fff;border:5px solid #fff}
.mm-num{font-size:42cqw;font-weight:700;line-height:1;text-shadow:0 3px 0 rgba(60,20,120,.35),0 0 18px rgba(255,255,255,.45)}
.mm-front{background:#fff;transform:rotateY(180deg);border:5px solid #fff;padding:6px;overflow:hidden}
.mm-front .pic{height:100%;width:auto;aspect-ratio:1;border-radius:12px}
.mm-word{font-weight:700;font-size:calc(19cqw * var(--fit,1));line-height:1.05;text-align:center;overflow-wrap:anywhere;padding:4px}
.mm-card.matched .mm-front{border-color:#40c057;animation:match-glow .8s}
.mm-card.matched{cursor:default}

/* =====================================================================
11. STEP 7 — WORD CHAIN
   ===================================================================== */
.chain-wrap{flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center}
.chain-hints{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ch-hint{border:none;background:#fff;border-radius:18px;padding:7px;width:clamp(84px,9.2vw,144px);cursor:pointer;box-shadow:0 4px 0 #e4ddf5;position:relative;transition:transform .15s}
.ch-hint:hover{transform:translateY(-3px)}
.ch-hint .pic{border-radius:12px}
.ch-hint.found::after{content:'✓';position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--mint);color:#fff;display:grid;place-items:center;font-weight:700}
.chain{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;row-gap:16px;column-gap:3px;padding:22px 18px;max-width:1150px;touch-action:none;cursor:pointer}
.ch-l{font-size:clamp(26px,3.6vw,44px);font-weight:700;width:clamp(28px,3.3vw,44px);text-align:center;border-radius:10px;line-height:1.35;position:relative;transition:background .18s,box-shadow .18s,color .18s,border-radius .18s}
/* live drag selection: one glowing translucent band */
.ch-l.sel{background:rgba(255,222,110,.6)!important;color:#4a2a00;border-radius:4px;box-shadow:0 0 0 2px rgba(255,226,120,.85),0 0 20px 4px rgba(255,200,60,.65);z-index:2}
.ch-l.sel.sf{border-radius:16px 4px 4px 16px}.ch-l.sel.sl{border-radius:4px 16px 16px 4px}.ch-l.sel.sf.sl{border-radius:12px}
.ch-l.anchor{box-shadow:var(--glow-violet)}
/* locked-in found word */
.ch-l.found{background:color-mix(in srgb,var(--wc) 80%,transparent)!important;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);border-radius:4px;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--wc) 55%,white),0 0 16px 3px color-mix(in srgb,var(--wc) 70%,transparent),0 0 34px 8px color-mix(in srgb,var(--wc) 35%,transparent);animation:letter-hop .5s backwards}
.ch-l.found.wf{border-radius:16px 4px 4px 16px}.ch-l.found.wl{border-radius:4px 16px 16px 4px}.ch-l.found.wf.wl{border-radius:12px}
.ch-l.err{animation:err-glow .9s ease-out}

/* =====================================================================
12. STEP 8 — DROP THE CURTAIN
   ===================================================================== */
.theater{position:fixed;left:0;right:0;top:var(--top);bottom:0;z-index:5;display:flex}
.stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,22px);padding:54px 16px 18px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#fff6d8,#f4c98a 70%,#b9763e);border:10px solid #6b2f12;box-shadow:var(--shadow);min-height:300px}
.valance{position:absolute;top:0;left:0;right:0;height:42px;z-index:6;
  background:radial-gradient(circle at 50% 0,#c2182f 70%,transparent 72%) 0 0/60px 60px repeat-x;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.valance::before{content:'';position:absolute;top:0;left:0;right:0;height:16px;background:#8e0b22}
.stage-items{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,1.5vw,20px);width:min(100%,calc((100vh - var(--top) - 220px) * 2.1),1320px)}
.st-item{text-align:center;animation:pop-in .4s backwards}
.st-item .pic,.st-item.blank .ph{width:min(100%,21vh);margin:0 auto}
.st-item .pic{border:5px solid #fff;box-shadow:0 6px 10px rgba(0,0,0,.2)}
.st-item b{display:block;font-size:clamp(14px,1.8vw,22px);margin-top:4px;color:#4a2208}
.st-item.blank .ph{aspect-ratio:1;border-radius:20px;border:5px dashed rgba(107,47,18,.5);display:grid;place-items:center;font-size:clamp(36px,5vw,70px);color:rgba(107,47,18,.6);background:rgba(255,255,255,.3)}
.st-item.back{animation:return-glow 1.2s}
.curtain{position:absolute;inset:0;z-index:5;display:flex;pointer-events:none}
.cpanel{flex:1;height:calc(100% - 20px);position:relative;transform:translateY(-115%);transform-origin:50% 0;will-change:transform;margin:0 -1px;
  background:
    linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,0) 16%,rgba(0,0,0,0) 72%,rgba(0,0,0,.3)),
    radial-gradient(ellipse 70% 90% at 35% 35%,rgba(255,140,160,.14),transparent 70%),
    repeating-linear-gradient(90deg,#4a0410 0%,#760a1c 8%,#a8112b 16%,#d22b46 22%,#ea5a70 24.5%,#c61c38 28%,#8e0b22 38%,#5e0616 46%,#4a0410 50%);
  box-shadow:inset 5px 0 8px rgba(0,0,0,.25),inset -3px 0 6px rgba(0,0,0,.18)}
/* gold braid along the hem */
.cpanel::before{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;
  background:repeating-linear-gradient(60deg,#ffe082 0 4px,#c99700 4px 7px,#ffd54f 7px 10px);box-shadow:0 2px 3px rgba(0,0,0,.35)}
/* scalloped hem edge with a gold trim and a small tassel under each scallop */
.cpanel::after{content:'';position:absolute;left:0;right:0;bottom:-20px;height:22px;
  background:
    radial-gradient(circle at 50% 78%,#ffe082 0 4px,#b8860b 5px,transparent 6px),
    radial-gradient(ellipse 50% 100% at 50% 0,#7d0a1e 0 52%,#ffd54f 54% 62%,transparent 64%);
  background-size:50% 100%;background-repeat:repeat-x}
.curtain.down .cpanel{animation:curtain-drop 1.9s cubic-bezier(.3,.02,.22,1) var(--d) both}
.curtain.up .cpanel{animation:curtain-rise 1.8s cubic-bezier(.42,0,.2,1) var(--d) both}
@keyframes curtain-drop{
  0%  {transform:translateY(-115%) skewX(0) scaleY(1)}
  48% {transform:translateY(3%) skewX(calc(var(--sk) * 1deg)) scaleY(1.025)}
  66% {transform:translateY(-1.6%) skewX(calc(var(--sk) * -.6deg)) scaleY(.995)}
  83% {transform:translateY(.6%) skewX(calc(var(--sk) * .28deg)) scaleY(1.005)}
  100%{transform:translateY(0) skewX(0) scaleY(1)}}
@keyframes curtain-rise{
  0%  {transform:translateY(0) skewX(0) scaleY(1)}
  16% {transform:translateY(1.3%) skewX(calc(var(--sk) * -.5deg)) scaleY(1.012)}
  60% {transform:translateY(-62%) skewX(calc(var(--sk) * .9deg)) scaleY(.985)}
  100%{transform:translateY(-115%) skewX(calc(var(--sk) * .4deg)) scaleY(.97)}}
.cur-opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:1320px;min-height:58px;position:relative;z-index:1}

/* =====================================================================
13. STEP 9 — BALLOON POP
   ===================================================================== */
.balloon-layer{position:fixed;left:0;right:0;top:var(--top);bottom:0;z-index:5;overflow:hidden;pointer-events:none}
.spell-card{position:fixed;left:14px;top:calc(var(--top) + 14px);z-index:6;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:24px;max-width:calc(100vw - 28px);
  background:var(--glass-2);backdrop-filter:var(--frost);-webkit-backdrop-filter:var(--frost);border:var(--glass-border);box-shadow:var(--glass-shadow)}
/* The card widens for long words (--need, set per word) so full-size letter slots stay on one line;
   the picture fills the card width, capped so the card always fits the screen height */
.spell-card{flex-direction:column;width:max(clamp(210px,19vw,280px),var(--need,0px));padding:12px}
.spell-card .sp-pic{width:min(100%,calc(100vh - var(--top) - 290px));margin:0 auto}
.spell-card .sp-picbox{width:100%}
.spell-card .sp-side{align-items:center;width:100%}
.spell-card .sp-slots{justify-content:center;flex-wrap:nowrap;gap:5px}
.spell-card .slot{flex:0 0 auto}
.spell-card .sp-word{white-space:nowrap;max-width:100%;padding:2px 12px}
.sp-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sp-slots{display:flex;flex-wrap:wrap;gap:5px}
.sp-picbox{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto}
.sp-word{display:none;font-weight:700;font-size:clamp(20px,2.2vw,30px);color:var(--ink);background:var(--glass-3);padding:2px 14px;border-radius:999px;box-shadow:0 0 14px rgba(255,214,90,.6);animation:pop-in .35s cubic-bezier(.2,1.6,.4,1)}
.spell-card.show-word .sp-word{display:block}
.sp-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp-tools .speaker,.sp-tools .tool{width:44px;height:44px;font-size:21px}
.sp-show.on{box-shadow:var(--glow);background:var(--glass-3)}
.slot{width:38px;height:48px;border-radius:10px;background:#fff;border-bottom:5px solid #c9bff0;display:grid;place-items:center;font-size:28px;font-weight:700;color:var(--primary)}
.slot.space{background:none;border:none;width:14px}
.slot.filled{animation:bounce .4s;border-color:var(--mint)}
.balloon{position:absolute;top:0;left:0;width:clamp(104px,10.5vw,150px);aspect-ratio:5/6;border:none;padding:0;cursor:pointer;background:none;will-change:transform;touch-action:manipulation;pointer-events:auto;backface-visibility:hidden}
.balloon .bb{position:absolute;inset:0;border-radius:50% 50% 48% 52%/58% 58% 42% 42%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 9%,transparent 22%),radial-gradient(circle at 50% 55%,var(--bc),color-mix(in srgb,var(--bc) 70%,black));
  box-shadow:inset -6px -8px 0 rgba(0,0,0,.08);display:grid;place-items:center;font-size:clamp(46px,4.8vw,70px);font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);padding-bottom:6%}
.balloon::before{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom-color:color-mix(in srgb,var(--bc) 80%,black);transform:rotate(180deg)}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:80px;background:rgba(80,80,80,.5);margin-top:9px}
.balloon.err .bb{animation:err-glow .9s ease-out,err-tint .7s ease-out}
@keyframes err-tint{20%{filter:saturate(1.5) brightness(1.08) drop-shadow(0 0 14px rgba(255,60,60,.95))}}
.balloon.popped{pointer-events:none}
.balloon.popped .bb{animation:pop-out .25s forwards}
.balloon.popped::after,.balloon.popped::before{opacity:0}
.shard{position:absolute;width:10px;height:10px;border-radius:3px;pointer-events:none;animation:shard .6s forwards}

/* =====================================================================
14. STEP 10 — HIDDEN TREASURE GRID
   ===================================================================== */
.tg{flex:1;display:grid;grid-template-columns:minmax(150px,220px) 1fr minmax(150px,220px);gap:14px;align-items:center;position:relative}
.tg-team{background:var(--glass);border-radius:26px;padding:16px 10px;text-align:center;box-shadow:var(--shadow);border:5px solid transparent;transition:transform .3s,border-color .3s,opacity .3s;opacity:.7}
.tg-team.active{opacity:1;transform:scale(1.05)}
.tg-team[data-team=fox].active{border-color:#ff8c2b;box-shadow:0 0 0 6px rgba(255,140,43,.25),var(--shadow)}
.tg-team[data-team=owl].active{border-color:#6f5bd6;box-shadow:0 0 0 6px rgba(111,91,214,.25),var(--shadow)}
.tg-m{width:min(130px,100%);height:120px;margin:0 auto;font-size:96px}
.tg-name{font-size:24px;font-weight:700}
.tg-score{font-size:56px;font-weight:700;line-height:1.1}
.tg-score.bump{animation:bounce .5s}
.tg-center{display:flex;flex-direction:column;align-items:center;gap:10px}
.tg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.2vw,12px);width:min(100%,calc(100vh - 260px),620px)}
.tile{aspect-ratio:1;border:none;background:none;padding:0;cursor:pointer;perspective:800px}
.tile-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.3,1.2);transform-style:preserve-3d}
.tile.open .tile-in{transform:rotateY(180deg)}
.tile-front,.tile-back{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tile-front{background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 8px,transparent 8px 16px),linear-gradient(135deg,#ffd257,#f59f00);border:4px solid #fff3c4;font-size:clamp(22px,3.4vw,40px);font-weight:700;color:#7a4a00}
.tile:not(.open):hover .tile-front{filter:brightness(1.08);transform:translateY(-3px)}
.tile.picked .tile-front{border-color:#fff}
.tile-back{transform:rotateY(180deg);background:radial-gradient(circle,#fffbe6,#ffe8a3);border:4px solid #fff;font-size:clamp(30px,5vw,60px)}
.tile-back .mascot{width:80%;height:80%;font-size:clamp(30px,5vw,60px)}
.tile.open{cursor:default}
.tg-q{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(30,20,60,.35);border-radius:var(--radius);padding:10px}
.tgq-card{background:var(--paper);border-radius:28px;padding:20px 26px;text-align:center;width:min(640px,100%);box-shadow:var(--shadow);animation:pop-in .4s cubic-bezier(.2,1.6,.4,1);position:relative;border:6px solid #ff8c2b}
.tgq-card.owl{border-color:#6f5bd6}
.tgq-card h3{margin:4px 0 12px;font-size:28px}
.tgq-m{position:absolute;top:-40px;left:-26px;width:90px;height:90px;font-size:70px}
.tgq-pic{width:min(220px,40vh);margin:0 auto 14px}
.tgq-opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tgq-opts.pics{margin-top:16px}
.pic-opt{padding:6px;width:clamp(100px,15vw,150px)}

/* =====================================================================
15. TEACHER MODE
   ===================================================================== */
.teacher-card{background:var(--paper);border-radius:26px;width:min(980px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 24px;box-shadow:var(--shadow);animation:pop-in .4s cubic-bezier(.2,1.5,.4,1);text-align:left}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.t-head h2{margin:0}
.t-lock{text-align:center;padding:10px}
.t-lock input{font-size:30px;width:140px;text-align:center;padding:8px;border-radius:14px;border:3px solid #d6cfee;margin:10px}
.t-topic{display:flex;align-items:center;gap:10px;font-weight:600;margin:12px 0;flex-wrap:wrap}
.t-topic input{flex:1;min-width:200px;max-width:360px}
.t-io{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 12px}

<script>
'use strict';
/* =======================================================================
0. DEFAULT DATA & CONSTANTS
   ======================================================================= */
const MIN_WORDS = 4, MAX_WORDS = 10;
const DEFAULT_TOPIC = 'School Subjects';
const DEFAULT_VOCAB = [
  { word:'maths',     say:'maths',     emoji:'🔢', img:'1.jpg' },
  { word:'russian',   say:'Russian',   emoji:'🪆', img:'2.jpg' },
  { word:'PE',        say:'P. E.',     emoji:'⚽', img:'3.jpg' },
  { word:'geography', say:'geography', emoji:'🌍', img:'4.jpg' },
  { word:'art',       say:'art',       emoji:'🎨', img:'5.jpg' },
  { word:'history',   say:'history',   emoji:'🏛️', img:'6.jpg' },
  { word:'music',     say:'music',     emoji:'🎵', img:'7.jpg' },
  { word:'science',   say:'science',   emoji:'🔬', img:'8.jpg' },
];
const COLORS = ['#ff6b6b','#ffa94d','#fcc419','#51cf66','#339af0','#9775fa','#f06595','#20c997','#ff8787','#63e6be'];
const LS = { data:'wordquest.vocab.v1', stars:'wordquest.stars.v1', mute:'wordquest.mute.v1', wsCase:'wordquest.wscase.v1', book:'wordquest.bookpos.v1' };
const BOOK_DEFAULT = {
  fox: { x:59, y:82, s:100, r:-2, mx:63, my:40 },
  owl: { x:38, y:79, s:100, r:3,  mx:41, my:29 },
};

/* =======================================================================
1. UTILITIES
   ======================================================================= */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = n => Math.floor(Math.random() * n);
const pick = a => a[randInt(a.length)];
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function lsGet(k, fb){ try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch(e){ return fb; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function flash(node, cls){ node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
function caseToggleHTML(){ return '<div class="case-toggle" role="group" aria-label="Letter case"><button data-c="upper" aria-label="Uppercase">AA</button><button data-c="lower" aria-label="Lowercase">aa</button></div>'; }
function bindCaseToggle(node, apply){
  const set = c => { lsSet(LS.wsCase, c); $$('[data-c]', node).forEach(b => b.classList.toggle('on', b.dataset.c === c)); apply(c === 'lower'); };
  node.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b){ Sound.ensure(); Sound.click(); set(b.dataset.c); } });
  set(lsGet(LS.wsCase, 'upper') === 'lower' ? 'lower' : 'upper');
}
function turnCard(card, open){ card.classList.remove('flip-open', 'flip-close'); void card.offsetWidth; card.classList.add(open ? 'flip-open' : 'flip-close'); }
function starStr(n, big=false){ return `<span class="stars ${big?'stars-big':''}">${[0,1,2].map(i=>`<i class="${i<n?'on':''}">★</i>`).join('')}</span>`; }
function toast(html, ms=1500){ const t = el(`<div class="toast">${html}</div>`); document.body.appendChild(t); setTimeout(()=>t.classList.add('out'), ms); setTimeout(()=>t.remove(), ms+500); }
const PRAISE = ['Fantastic!','Brilliant!','Super star!','Amazing work!','Well done!','Awesome!'];

/* =======================================================================
2. VOCABULARY STATE, JSON PACKS & ASSETS
   ======================================================================= */
let topic = DEFAULT_TOPIC;
let vocab = [];
const ASSET = { fox:'', owl:'' };

function setVocab(list){
  vocab = list.slice(0, MAX_WORDS).map((v, i) => ({
    word: String(v.word||'').trim(), say: String(v.say||'').trim(), emoji: v.emoji || '⭐',
    img: v.img || '', id: i, src: v.img || ''
  }));
}
function validatePackData(raw){
  if (!raw || typeof raw !== 'object') return { error:'Invalid pack format.' };
  const rawWords = Array.isArray(raw.words) ? raw.words : (Array.isArray(raw) ? raw : null);
  if (!rawWords) return { error:'Pack must contain a "words" array.' };
  const cleaned = rawWords
    .map(w => typeof w === 'string'
      ? { word:w.trim(), say:'', emoji:'⭐', img:'' }
      : { word:String(w?.word||'').trim(), say:String(w?.say||'').trim(), emoji:String(w?.emoji||'').trim() || '⭐', img:String(w?.img||'').trim() })
    .filter(w => w.word);
  if (cleaned.length < MIN_WORDS || cleaned.length > MAX_WORDS){
    return { error:`Pack must have between ${MIN_WORDS} and ${MAX_WORDS} words (found ${cleaned.length}).` };
  }
  const seen = new Set();
  for (const w of cleaned){
    const key = w.word.toLowerCase();
    if (seen.has(key)) return { error:`Duplicate word "${w.word}" in pack.` };
    seen.add(key);
  }
  const packTopic = String(raw.topic || raw.title || 'Custom Pack').trim().slice(0, 40) || 'Custom Pack';
  return { data:{ topic:packTopic, words:cleaned, book:raw.book || null } };
}
function loadSaved(){
  const d = lsGet(LS.data, null);
  if (d && Array.isArray(d.words) && d.words.length >= MIN_WORDS){
    topic = d.topic || DEFAULT_TOPIC;
    setVocab(d.words.slice(0, MAX_WORDS));
  } else {
    topic = DEFAULT_TOPIC;
    setVocab(DEFAULT_VOCAB);
  }
}
function probe(src, ms=3000){
  return new Promise(res => {
    const im = new Image(); let done = false;
    const fin = ok => { if (!done){ done = true; res(ok); } };
    setTimeout(() => fin(false), ms);
    im.onload = () => fin(true); im.onerror = () => fin(false);
    im.src = src;
  });
}
const slug = w => w.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
async function findFirstImage(candidates){
  for (const cand of candidates){
    if (await probe(cand, 1600)) return cand;
  }
  return '';
}
async function resolveAssets(){
  const jobs = [
    probe('fox.png').then(ok => ASSET.fox = ok ? 'fox.png' : ''),
    probe('owl.png').then(ok => ASSET.owl = ok ? 'owl.png' : ''),
    ...vocab.map(async (v, idx) => {
      if (v.img){
        const ok = await probe(v.img, 2000);
        if (ok){ v.src = v.img; return; }
      }
      const s = slug(v.word);
      const num = idx + 1;
      const candidates = [];
      if (s){
        candidates.push(`images/${s}.jpg`, `images/${s}.png`, `images/${s}.webp`);
      }
      candidates.push(`images/${num}.jpg`, `images/${num}.png`, `images/${num}.webp`);
      v.src = await findFirstImage(candidates);
    })
  ];
  await Promise.all(jobs);
}
function pic(item, cls=''){

}

/* =======================================================================
3. SOUND — procedural Web Audio SFX
   ======================================================================= */
const Sound = {
  ctx:null, master:null, muted: lsGet(LS.mute, false),
  ensure(){
    if (!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .6; this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, d, {type='sine', vol=.25, at=0, to=null, attack=.01}={}){
    if (this.muted) return; const c = this.ensure(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .05);
  },
  noise(d, {vol=.3, at=0, freq=1000, to=null, type='bandpass', q=1}={}){
    if (this.muted) return; const c = this.ensure(); if (!c) return;
    const t = c.currentTime + at, len = Math.max(1, Math.floor(c.sampleRate * d));
    const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const fl = c.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(freq, t); if (to) fl.frequency.exponentialRampToValueAtTime(to, t + d);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    src.connect(fl); fl.connect(g); g.connect(this.master); src.start(t); src.stop(t + d + .02);
  },
  click(){ this.tone(660, .06, {type:'triangle', vol:.12}); },
  flip(){ this.noise(.12, {vol:.35, freq:2600, to:900, q:.8}); this.tone(520, .09, {type:'triangle', vol:.07, to:820}); },
  splash(){ this.noise(.5, {vol:.5, freq:2200, to:260, type:'lowpass'}); [0,.06,.13].forEach((a,i)=>this.tone(700+i*180, .14, {vol:.1, at:a, to:1500+i*250})); },
  munch(){
    for (let i = 0; i < 3; i++){ const at = i * .17; this.noise(.1, {vol:.6, freq:700, to:220, type:'lowpass', at}); this.tone(190 - i*18, .09, {type:'square', vol:.06, at, to:85}); }
    this.tone(330, .16, {vol:.12, at:.55, to:880}); this.tone(1320, .12, {vol:.06, at:.68});
  },
  drip(){ this.tone(1200, .12, {vol:.06, to:500}); },
  pop(){ this.noise(.09, {vol:.7, freq:3200, type:'highpass'}); this.tone(420, .08, {type:'square', vol:.07, to:110}); },
  whoosh(){ this.noise(1.0, {vol:.4, freq:250, to:2600, q:1.4}); },
  reveal(){ this.tone(700, .14, {vol:.1, to:1300}); },
  coin(){ this.tone(988, .09, {type:'square', vol:.07}); this.tone(1319, .35, {type:'square', vol:.07, at:.09}); },
  correct(){ [523.25,659.25,783.99].forEach((f,i)=>this.tone(f, .28, {type:'triangle', vol:.2, at:i*.08})); this.tone(1046.5, .45, {vol:.12, at:.24}); },
  wrong(){ this.tone(220, .18, {type:'sawtooth', vol:.07, to:180}); this.tone(185, .24, {type:'square', vol:.04, at:.12, to:150}); },
  fanfare(){
    const n = [523.25,659.25,783.99,1046.5,783.99,1046.5], d = [.12,.12,.12,.28,.12,.6]; let t = 0;
    n.forEach((f,i)=>{ this.tone(f, d[i]+.12, {type:'triangle', vol:.2, at:t}); this.tone(f/2, d[i]+.12, {vol:.1, at:t}); t += d[i]; });
  },
};

/* =======================================================================
4. VOICE — speechSynthesis pronunciation
   ======================================================================= */
const Voice = {
  ok: 'speechSynthesis' in window, voices:[], current:null,
  init(){
    if (!this.ok) return;
    const load = () => { this.voices = speechSynthesis.getVoices(); };
    load(); speechSynthesis.addEventListener('voiceschanged', load);
  },
  pick(text){
    const vs = this.voices.length ? this.voices : speechSynthesis.getVoices();
    const lang = /[Ѐ-ӿ]/.test(text) ? 'ru' : 'en';
    const score = v => (v.localService ? 4 : 0) + (lang === 'en' && /en[-_]gb/i.test(v.lang) ? 3 : 0) + (/female|libby|sonia|serena|hazel|kate|zira|irina/i.test(v.name) ? 1 : 0);
    return vs.filter(v => v.lang.toLowerCase().startsWith(lang)).sort((a, b) => score(b) - score(a))[0] || null;
  },
  say(text, rate=.85){
    text = String(text || '').trim();
    if (!this.ok || Sound.muted || !text) return;
    const synth = speechSynthesis;
    synth.cancel(); if (synth.paused) synth.resume();
    const attempt = useVoice => {
      const u = new SpeechSynthesisUtterance(text), v = useVoice ? this.pick(text) : null;
      if (v){ u.voice = v; u.lang = v.lang; } else u.lang = /[Ѐ-ӿ]/.test(text) ? 'ru-RU' : 'en-GB';
      u.rate = rate; u.pitch = 1.05;
      this.current = u;
      let started = false;
      u.onstart = () => { started = true; };
      u.onerror = e => { if (!started && useVoice && !/interrupted|canceled/.test(e.error)) attempt(false); };
      synth.speak(u);
      if (useVoice) setTimeout(() => { if (this.current === u && !started){ synth.cancel(); attempt(false); } }, 1500);
    };
    setTimeout(() => attempt(true), 60);
  }
};
const sayItem = it => it && Voice.say(it.say && /\p{L}/u.test(it.say) ? it.say : it.word);

/* =======================================================================
5. CONFETTI
   ======================================================================= */
const Confetti = {
  parts:[], running:false,
  burst(n=170, originY=-20){
    const cv = $('#confetti'); cv.width = innerWidth; cv.height = innerHeight;
    for (let i = 0; i < n; i++) this.parts.push({
      x: rand(0, cv.width), y: originY - rand(0, 200), vx: rand(-2, 2), vy: rand(2, 6),
      r: rand(0, 6.28), vr: rand(-.2, .2), s: rand(7, 14), c: pick(COLORS.concat(['#fff','#ffd43b'])), sh: randInt(3)
    });
    if (!this.running){ this.running = true; requestAnimationFrame(() => this.tick()); }
  },
  tick(){
    const cv = $('#confetti'), x = cv.getContext('2d'); x.clearRect(0, 0, cv.width, cv.height);
    this.parts = this.parts.filter(p => p.y < cv.height + 30);
    for (const p of this.parts){
      p.x += p.vx + Math.sin(p.y / 40); p.y += p.vy; p.vy += .04; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
      if (p.sh === 0) x.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
      else if (p.sh === 1){ x.beginPath(); x.arc(0, 0, p.s/2.6, 0, 6.28); x.fill(); }
      else { x.beginPath(); x.moveTo(0, -p.s/2); x.lineTo(p.s/2, p.s/2); x.lineTo(-p.s/2, p.s/2); x.fill(); }
      x.restore();
    }
    if (this.parts.length) requestAnimationFrame(() => this.tick()); else { this.running = false; x.clearRect(0, 0, cv.width, cv.height); }
  }
};

/* =======================================================================
6. STEP LIFECYCLE
   ======================================================================= */
const G = { gen:0, timers:[], listeners:[] };
function later(fn, ms){ const g = G.gen; const id = setTimeout(() => { if (g === G.gen) fn(); }, ms); G.timers.push(id); return id; }
function onGlobal(target, ev, fn, opts){ target.addEventListener(ev, fn, opts); G.listeners.push([target, ev, fn, opts]); }
function animLoop(fn){
  const g = G.gen; let last = performance.now();
  const tick = t => { if (g !== G.gen) return; const dt = Math.min(.05, (t - last) / 1000); last = t; if (fn(dt, t) !== false) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function teardown(){
  G.gen++; G.timers.forEach(clearTimeout); G.timers = [];
  G.listeners.forEach(([t, e, f, o]) => t.removeEventListener(e, f, o)); G.listeners = [];
  if (Voice.ok) speechSynthesis.cancel();
}

/* =======================================================================
   STEP 1 — FLASHCARDS WITH SOUNDS
   ======================================================================= */
function step1(app){
  let i = 0; const seen = new Set();
  const f = frame(app, 1, 'Tap the card to flip it and hear the word. Use ◀ ▶ (or the arrow keys / swipe) to meet every word.', { replay: () => sayItem(vocab[i]) });
  const doneBtn = f.addTool('<button class="tool hidden" aria-label="Finish">✅</button>', () => finishStep(1, 3, `You met all ${vocab.length} new words!`));
  f.body.innerHTML = `<div class="fc-wrap">
      <button class="arrow" data-d="-1" aria-label="Previous card">◀</button>
      <div class="fc-frame"><div class="fc-stage"></div></div>
      <button class="arrow" data-d="1" aria-label="Next card">▶</button></div>
    <div class="fc-dots">${vocab.map((v, k) => `<button class="dot" data-k="${k}" aria-label="${esc(v.word)}"></button>`).join('')}</div>`;
  const stage = $('.fc-stage', f.body);

  function show(k, dir=1){
    i = (k + vocab.length) % vocab.length; const v = vocab[i]; seen.add(i);
    stage.innerHTML = `<div class="flashcard ${dir > 0 ? 'in-right' : 'in-left'}" tabindex="0" role="button" aria-label="${esc(v.word)} card">
      <div class="fc-inner">
        <div class="fc-face fc-front">${pic(v, 'fc-pic')}</div>
        <div class="fc-face fc-back">${pic(v, 'fc-pic-back')}<div class="fc-word" style="color:${COLORS[v.id % COLORS.length]};--fit:${Math.min(1, 8 / Math.max(1, v.word.length))}">${esc(v.word)}</div></div>
      </div></div>`;
    $$('.dot', f.body).forEach((d, q) => { d.classList.toggle('on', q === i); d.classList.toggle('seen', seen.has(q)); });

    if (seen.size === vocab.length) doneBtn.classList.remove('hidden');
    Sound.flip();
    const card = $('.flashcard', stage);
    card.addEventListener('click', () => {
      if (swiped) return;
      const toBack = !card.classList.contains('flipped');
      card.classList.toggle('flipped'); card.classList.remove('in-right', 'in-left'); turnCard(card, toBack); flash(card, 'glow'); Sound.flip();
      if (toBack) later(() => sayItem(v), 380); else if (Voice.ok) speechSynthesis.cancel();
    });
  }
  $$('.arrow', f.body).forEach(b => b.addEventListener('click', () => { const d = +b.dataset.d; show(i + d, d); }));
  $$('.dot', f.body).forEach(b => b.addEventListener('click', () => { const k = +b.dataset.k; show(k, k >= i ? 1 : -1); }));
  let sx = null, swiped = false;
  stage.addEventListener('pointerdown', e => { sx = e.clientX; swiped = false; });
  stage.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 70){ swiped = true; show(i + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1); setTimeout(() => swiped = false, 50); } });
  onGlobal(document, 'keydown', e => {
    if (!$('#teacher').classList.contains('hidden')) return;
    if (e.key === 'ArrowRight') show(i + 1, 1);
    else if (e.key === 'ArrowLeft') show(i - 1, -1);
    else if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); $('.flashcard', stage)?.click(); }
  });
  show(0);
}

/* =======================================================================
   STEP 2 — FOREST SORTING
   ======================================================================= */
function step2(app){
  const rounds = shuffle(vocab); let r = 0, mistakes = 0, busy = false, target = null, sides = [];
  const f = frame(app, 2, 'Drag the picture onto the animal whose book shows the right word — and watch it get gobbled up! 😋', { replay: () => sayItem(target) });
  f.body.innerHTML = `<div class="forest-game"><div class="target-slot"></div><div class="critters">${critterHTML('fox')}${critterHTML('owl')}</div></div>`;
  const slot = $('.target-slot', f.body), crits = $$('.critter', f.body);
  crits.forEach(applyBookPos);

  function round(){
    if (r >= rounds.length){
      const st = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
      return finishStep(2, st, `The fox and the owl ate ${rounds.length} pictures! (${mistakes} mistake${mistakes === 1 ? '' : 's'})`);
    }
    busy = false; target = rounds[r]; sides = shuffle([target, others(target, 1)[0]]);
    crits.forEach((c, k) => { setBookWord(c, sides[k].word); flash($('.book-text', c), 'ink'); c.classList.remove('hover', 'chomp', 'err'); });

  function bounceBack(card, wrong=false){

  const offset = card => { const m = card.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/); return m ? [+m[1], +m[2]] : [0, 0]; };
  function sparkles(crit, x, y){
    const host = f.body.querySelector('.forest-game'), hr = host.getBoundingClientRect();
    ['✨','⭐','💫','✨','🌟','✨','⭐','💛'].forEach((s, k) => {
      const a = k / 8 * 6.28 + rand(-.3, .3), d = rand(60, 120);
      const sp = el(`<span class="sparkle" style="left:${x - hr.left}px;top:${y - hr.top}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;animation-delay:${k * 30}ms">${s}</span>`);
      host.appendChild(sp); setTimeout(() => sp.remove(), 1100);
    });
    for (let k = 0; k < 14; k++){
      const a = rand(0, 6.28), d = rand(30, 90), c = el(`<span class="crumb" style="left:${x - hr.left}px;top:${y - hr.top}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d + 40}px;width:${rand(5, 11)}px;height:${rand(5, 11)}px"></span>`);

    busy = true; crit.classList.remove('hover');
    const kind = crit.dataset.kind, p = ASSET[kind] ? bookPos()[kind] : { mx:50, my:32 };
    const cr = crit.getBoundingClientRect(), kr = card.getBoundingClientRect(), [ox, oy] = offset(card);
    const mx = cr.left + cr.width * p.mx / 100, my = cr.top + cr.height * p.my / 100;

    later(() => { Sound.correct(); sayItem(target); }, 1250);
    r++; later(round, 2100);
  }
  function answer(k, card){
    if (busy) return; const crit = crits[k];
    if (sides[k] === target) eat(crit, card);

  }
  const critAt = (x, y) => crits.find(c => { const b = c.getBoundingClientRect(); return x >= b.left && x <= b.right && y >= b.top && y <= b.bottom; });
  function bindDrag(card){
    let d = null;
    card.addEventListener('pointerdown', e => {
      if (busy) return; e.preventDefault(); Sound.ensure();
      try { card.setPointerCapture(e.pointerId); } catch(_){} d = { x:e.clientX, y:e.clientY, moved:false };
      card.classList.add('dragging', 'cookie-mode'); card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e => {
      if (!d) return; const dx = e.clientX - d.x, dy = e.clientY - d.y;
      if (Math.hypot(dx, dy) > 6) d.moved = true;
      card.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 30}deg)`;
      const c = critAt(e.clientX, e.clientY); crits.forEach(q => q.classList.toggle('hover', q === c));

    card.addEventListener('pointerup', e => {

  }
